<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디든 가는 기차 — 힐링 프로토타입</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b132b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%}
  #title{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:#fff;font-size:14px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.45);opacity:.92;pointer-events:none}
  #title small{display:block;font-size:11px;opacity:.75;margin-top:2px}
  #region{position:fixed;top:22%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(20px,4.5vw,34px);
    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.5);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap}
  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.8;margin-top:6px}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;background:rgba(10,14,24,.38);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:999px;color:#fff}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;min-width:44px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">어디든 가는 기차<small>프로토타입 · 배경이 빨리 바뀌는 테스트 버전입니다</small></div>
<div id="region"></div>
<div id="bar">
  <button id="playBtn">멈추기</button>
  <button id="speedBtn">속도 1배</button>
  <button id="soundBtn">소리 켜기</button>
  <span id="clock">00:00</span>
</div>

<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
function hash(n){ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerpColor(c1,c2,t){
  const a=hexRGB(c1), b=hexRGB(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
function paletteLerp(p,q,t){
  const o={};
  for(const k in p){ o[k] = (typeof p[k]==='number') ? lerp(p[k],q[k],t) : lerpColor(p[k],q[k],t); }
  return o;
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ---------- biomes (맵 컨셉) ---------- */
const BIOMES = [
  { name:"아침 초원", sub:"MEADOW", skyTop:"#8ecdf0", skyBot:"#fdf6d8", sun:"#fff3b0", far:"#9cc184", mid:"#6fa35c", ground:"#5d9153", groundDark:"#4a7a43", deco:"#2f6b33", star:0 },
  { name:"깊은 숲",   sub:"FOREST",  skyTop:"#a8dcc0", skyBot:"#eef7d9", sun:"#fff8c9", far:"#5da271", mid:"#35704c", ground:"#27603f", groundDark:"#1d4e33", deco:"#123d27", star:0 },
  { name:"바닷가",    sub:"COAST",   skyTop:"#7fd4f2", skyBot:"#e8fbff", sun:"#fff6bf", far:"#5fb8d6", mid:"#8fd0b2", ground:"#d9c58a", groundDark:"#c2ab6f", deco:"#2e7d5b", star:0 },
  { name:"노을 사막", sub:"DESERT",  skyTop:"#f28c6b", skyBot:"#ffe6a7", sun:"#ffdf6b", far:"#d97b4f", mid:"#c96f3f", ground:"#e3b96a", groundDark:"#cda154", deco:"#7a4a21", star:0.15 },
  { name:"눈 내리는 마을", sub:"SNOW", skyTop:"#bcd9ea", skyBot:"#ffffff", sun:"#ffffff", far:"#cfe3ee", mid:"#a9c6d8", ground:"#f4f9fc", groundDark:"#ddeaf2", deco:"#33566b", star:0 },
  { name:"밤하늘",    sub:"NIGHT",   skyTop:"#0b132b", skyBot:"#3a506b", sun:"#f4f1de", far:"#2c3e58", mid:"#22314a", ground:"#232a3d", groundDark:"#1a2030", deco:"#0f1626", star:1 },
];
const SEG = 2800;          // 한 컨셉 구간의 길이(px, 월드 기준)
const BLEND = 700;         // 다음 컨셉으로 섞이는 구간
function biomeIndexAt(x){ return Math.floor(x/SEG); }
function paletteAt(x){
  const i = biomeIndexAt(x);
  const cur = BIOMES[((i%BIOMES.length)+BIOMES.length)%BIOMES.length];
  const nxt = BIOMES[(((i+1)%BIOMES.length)+BIOMES.length)%BIOMES.length];
  const into = x - i*SEG;
  const t = clamp((into-(SEG-BLEND))/BLEND, 0, 1);
  return t<=0 ? cur : paletteLerp(cur, nxt, t*t*(3-2*t));
}
function biomeAt(x){ const i=biomeIndexAt(x); return BIOMES[((i%BIOMES.length)+BIOMES.length)%BIOMES.length]; }

/* ---------- track ---------- */
function trackY(x){
  const base = H*0.68;
  return base
    + Math.sin(x*0.00115)*36
    + Math.sin(x*0.00265+1.7)*19
    + Math.sin(x*0.00042+0.4)*46;
}
function trackSlope(x){ return (trackY(x+4)-trackY(x-4))/8; }

/* ---------- journey state ---------- */
let playing = true;
let speedMul = 1;
let worldX = 0;            // 기관차 앞부분의 월드 좌표
const BASE_SPEED = 68;     // px/s — 느린 힐링 속도
let elapsed = 0;
let lastBiomeIdx = -1;
const smoke = [];

const regionEl = document.getElementById('region');
const clockEl = document.getElementById('clock');
let regionTimer = null;
function announce(b){
  regionEl.innerHTML = `${b.name}<small>${b.sub}</small>`;
  regionEl.style.opacity = 1;
  clearTimeout(regionTimer);
  regionTimer = setTimeout(()=>{ regionEl.style.opacity = 0; }, 3400);
}

/* ---------- scenery drawing ---------- */
function hillLayer(parallax, amp, freq, color, baseOff){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-4, H);
  for(let sx=-4; sx<=W+40; sx+=36){
    const wx = (worldX*parallax) + sx;
    const y = H*0.68 + baseOff + Math.sin(wx*freq)*amp + Math.sin(wx*freq*2.7+2.1)*amp*0.35 - trackY(worldX)*0 + (trackY(worldX)-H*0.68)*parallax*0.4;
    ctx.lineTo(sx, y);
  }
  ctx.lineTo(W+4, H); ctx.closePath(); ctx.fill();
}
function drawSky(pal){
  const g = ctx.createLinearGradient(0,0,0,H*0.75);
  g.addColorStop(0, pal.skyTop); g.addColorStop(1, pal.skyBot);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // stars
  if(pal.star > 0.03){
    ctx.save(); ctx.globalAlpha = pal.star;
    ctx.fillStyle = "#ffffff";
    for(let i=0;i<70;i++){
      const sx = hash(i*3.3)*W, sy = hash(i*7.9)*H*0.45, r = hash(i*13.1)*1.4+0.4;
      ctx.globalAlpha = pal.star*(0.35+hash(i*5.5)*0.65);
      ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  // sun / moon
  const sx = W*0.78, sy = H*0.2;
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = pal.sun;
  ctx.shadowColor = pal.sun; ctx.shadowBlur = 42;
  ctx.beginPath(); ctx.arc(sx,sy, pal.star>0.6?26:34, 0, Math.PI*2); ctx.fill();
  ctx.restore();
  if(pal.star>0.6){ // 달 그림자 -> 초승달 느낌
    ctx.fillStyle = pal.skyTop;
    ctx.beginPath(); ctx.arc(sx+11,sy-7,22,0,Math.PI*2); ctx.fill();
  }
}
function drawGround(camX, palCenter){
  // 땅: 트랙 곡선을 따라 채움 (구간별 색을 섞어 컨셉 전환이 스르륵 보이게)
  const step = 46;
  for(let sx=-step; sx<W+step; sx+=step){
    const wx = camX+sx;
    const pal = paletteAt(wx);
    ctx.fillStyle = pal.ground;
    ctx.beginPath();
    ctx.moveTo(sx, trackY(wx)+16);
    ctx.lineTo(sx+step+1, trackY(camX+sx+step)+16);
    ctx.lineTo(sx+step+1, H); ctx.lineTo(sx, H); ctx.closePath(); ctx.fill();
    // 아래쪽 그라데이션 음영
    ctx.fillStyle = pal.groundDark;
    ctx.globalAlpha = 0.35;
    ctx.fillRect(sx, H*0.9, step+1, H*0.1);
    ctx.globalAlpha = 1;
  }
}
function drawTree(x,y,s,pal,kind){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = "#5b4632";
  if(kind==='palm'){
    ctx.fillRect(-2*s,-26*s,4*s,26*s);
    ctx.strokeStyle = pal.deco; ctx.lineWidth = 3.4*s; ctx.lineCap="round";
    for(let a=0;a<5;a++){
      ctx.beginPath(); ctx.moveTo(0,-26*s);
      const ang = -Math.PI*0.85 + a*0.42;
      ctx.quadraticCurveTo(Math.cos(ang)*16*s, -26*s+Math.sin(ang)*12*s-6*s, Math.cos(ang)*24*s, -26*s+Math.sin(ang)*18*s+4*s);
      ctx.stroke();
    }
  } else if(kind==='cactus'){
    ctx.fillStyle = pal.deco;
    rr(-4*s,-30*s,8*s,30*s,4*s); ctx.fill();
    rr(-13*s,-22*s,6*s,13*s,3*s); ctx.fill(); rr(-13*s,-22*s,11*s,5*s,2.5*s); ctx.fill();
    rr(7*s,-26*s,6*s,17*s,3*s); ctx.fill(); rr(2*s,-26*s,11*s,5*s,2.5*s); ctx.fill();
  } else if(kind==='pine'){
    ctx.fillRect(-2.2*s,-10*s,4.4*s,10*s);
    ctx.fillStyle = pal.deco;
    for(let i=0;i<3;i++){
      const w=(20-i*4.6)*s, yy=-8*s-i*10*s;
      ctx.beginPath(); ctx.moveTo(-w/2,yy); ctx.lineTo(w/2,yy); ctx.lineTo(0,yy-15*s); ctx.closePath(); ctx.fill();
    }
  } else { // round tree
    ctx.fillRect(-2.4*s,-14*s,4.8*s,14*s);
    ctx.fillStyle = pal.deco;
    ctx.beginPath(); ctx.arc(0,-24*s,13*s,0,Math.PI*2); ctx.arc(-10*s,-17*s,9*s,0,Math.PI*2); ctx.arc(10*s,-17*s,9*s,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawDecor(camX){
  const cell = 170;
  const i0 = Math.floor((camX-100)/cell), i1 = Math.floor((camX+W+100)/cell);
  for(let i=i0;i<=i1;i++){
    const r = hash(i);
    if(r < 0.28) continue;                       // 빈 구간도 있어야 쉼이 있다
    const wx = i*cell + hash(i*1.7)*90;
    const sx = wx - camX;
    const gy = trackY(wx);
    const pal = paletteAt(wx);
    const name = biomeAt(wx).sub;
    const s = 0.8 + hash(i*2.3)*0.55;
    const behind = gy + 6;                        // 선로 뒤쪽 땅에 심기
    if(name==='FOREST') drawTree(sx, behind, s*1.25, pal, 'pine');
    else if(name==='SNOW'){ drawTree(sx, behind, s*1.1, pal, 'pine');
      ctx.fillStyle="rgba(255,255,255,.85)";
      ctx.beginPath(); ctx.arc(sx, behind-34*s, 5*s, 0, Math.PI*2); ctx.fill(); }
    else if(name==='COAST') drawTree(sx, behind, s, pal, r>0.8?'palm':'round');
    else if(name==='DESERT'){ if(r>0.55) drawTree(sx, behind, s, pal, 'cactus');
      else { ctx.fillStyle=pal.deco; ctx.globalAlpha=.6; rr(sx-12*s, behind-8*s, 24*s, 8*s, 4*s); ctx.fill(); ctx.globalAlpha=1; } }
    else if(name==='NIGHT'){
      if(r>0.72){ // 불 켜진 집
        ctx.fillStyle="#10182b"; ctx.fillRect(sx-17*s, behind-24*s, 34*s, 24*s);
        ctx.beginPath(); ctx.moveTo(sx-21*s, behind-24*s); ctx.lineTo(sx+21*s, behind-24*s); ctx.lineTo(sx, behind-36*s); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#ffd97a"; ctx.fillRect(sx-9*s, behind-16*s, 6*s, 7*s); ctx.fillRect(sx+4*s, behind-16*s, 6*s, 7*s);
      } else drawTree(sx, behind, s*1.1, pal, 'pine');
    }
    else { // MEADOW
      if(r>0.86){ // 작은 집
        ctx.fillStyle="#8a5a3b"; ctx.fillRect(sx-15*s, behind-20*s, 30*s, 20*s);
        ctx.fillStyle="#6e4527"; ctx.beginPath(); ctx.moveTo(sx-19*s, behind-20*s); ctx.lineTo(sx+19*s, behind-20*s); ctx.lineTo(sx, behind-31*s); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#fff2b0"; ctx.fillRect(sx-4*s, behind-13*s, 8*s, 9*s);
      } else drawTree(sx, behind, s, pal, 'round');
      // 꽃 점들
      ctx.fillStyle = r>0.5 ? "#ffb7d5" : "#fff3a0";
      for(let f=0;f<3;f++){ const fx=sx+(hash(i*9+f)-0.5)*70, fy=gy+30+hash(i*4+f)*26;
        ctx.beginPath(); ctx.arc(fx,fy,2.1,0,Math.PI*2); ctx.fill(); }
    }
  }
}
function drawTrack(camX){
  const step = 22;
  // 노반(자갈밭)
  ctx.strokeStyle = "rgba(90,80,72,.9)"; ctx.lineWidth = 13; ctx.lineCap="round";
  ctx.beginPath();
  for(let sx=-30; sx<=W+30; sx+=step){ const wx=camX+sx; const y=trackY(wx)+7; sx===-30?ctx.moveTo(sx,y):ctx.lineTo(sx,y); }
  ctx.stroke();
  // 침목
  ctx.strokeStyle = "#4c3a28"; ctx.lineWidth = 5;
  for(let wx = Math.floor(camX/30)*30; wx < camX+W+30; wx+=30){
    const sx = wx-camX, y = trackY(wx)+7, a = Math.atan(trackSlope(wx));
    ctx.save(); ctx.translate(sx,y); ctx.rotate(a);
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,8); ctx.stroke(); ctx.restore();
  }
  // 레일
  ctx.strokeStyle = "#d9dee6"; ctx.lineWidth = 3.4;
  ctx.beginPath();
  for(let sx=-30; sx<=W+30; sx+=step){ const wx=camX+sx; const y=trackY(wx); sx===-30?ctx.moveTo(sx,y):ctx.lineTo(sx,y); }
  ctx.stroke();
}

/* ---------- train (6량) ---------- */
const CAR_W = 108, CAR_GAP = 10, CAR_STEP = CAR_W + CAR_GAP;
const CAR_COLORS = ["#31556e","#7a4b3a","#4a6741","#6b5b8f","#8a6d3b","#546e7a"];
function drawCar(sx, wx, idx){
  const y = trackY(wx), a = Math.atan(trackSlope(wx));
  ctx.save(); ctx.translate(sx, y); ctx.rotate(a);
  const isLoco = idx===0;
  const h = 50;
  // 바퀴
  ctx.fillStyle = "#1d2126";
  for(const bx of [-CAR_W/2+20, CAR_W/2-20]){ ctx.beginPath(); ctx.arc(bx,-7,8.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#59616b"; ctx.beginPath(); ctx.arc(bx,-7,3.4,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#1d2126"; }
  // 차체
  ctx.fillStyle = CAR_COLORS[idx];
  rr(-CAR_W/2, -h-12, CAR_W, h, 9); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.22)"; rr(-CAR_W/2, -h-12, CAR_W, 11, 9); ctx.fill(); // 지붕
  if(isLoco){
    ctx.fillStyle = CAR_COLORS[0];
    rr(CAR_W/2-30, -h-26, 30, 16, 5); ctx.fill();            // 운전실
    ctx.fillStyle = "#20262c"; ctx.fillRect(CAR_W/2-16, -h-44, 9, 20); // 굴뚝
    ctx.fillStyle = "#ffd97a"; ctx.beginPath(); ctx.arc(CAR_W/2-2,-30,4.4,0,Math.PI*2); ctx.fill(); // 전조등
  }
  // 창문 (따뜻한 불빛)
  const night = paletteAt(wx).star > 0.5;
  ctx.fillStyle = night ? "#ffd97a" : "#ffeec2";
  const n = isLoco?2:4;
  for(let i=0;i<n;i++){
    const wxp = -CAR_W/2 + 14 + i*((CAR_W-24)/n);
    rr(wxp, -h+2, (CAR_W-30)/n - 6, 17, 3.5); ctx.fill();
  }
  ctx.restore();
}
function drawTrain(camX){
  // 뒤 칸부터 그려 기관차가 맨 위에 오게
  for(let idx=5; idx>=0; idx--){
    const wx = worldX - idx*CAR_STEP - CAR_W/2;
    drawCar(wx - camX, wx, idx);
  }
  // 연기
  const locoWx = worldX - CAR_W/2 + CAR_W/2 - 12;
  const lx = locoWx - camX, ly = trackY(locoWx) - 108;
  if(playing && Math.random()<0.35) smoke.push({x:lx, y:ly, r:5, life:1});
  for(let i=smoke.length-1;i>=0;i--){
    const p=smoke[i]; p.x-=0.35; p.y-=0.55; p.r+=0.24; p.life-=0.011;
    if(p.life<=0){ smoke.splice(i,1); continue; }
    ctx.fillStyle = `rgba(255,255,255,${0.34*p.life})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
}

/* ---------- audio: 아주 잔잔한 패드 (선택) ---------- */
let audioCtx=null, audioOn=false, padTimer=null;
function toggleAudio(){
  if(audioOn){
    audioOn=false; clearInterval(padTimer); if(audioCtx) audioCtx.close(); audioCtx=null;
    document.getElementById('soundBtn').textContent="소리 켜기"; return;
  }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const chords = [[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];
  let ci=0;
  const playChord=()=>{
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    chords[ci%chords.length].forEach(f=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+1.6);
      g.gain.linearRampToValueAtTime(0.0001,t+7.8);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+8);
    });
    ci++;
  };
  playChord(); padTimer=setInterval(playChord, 7000);
  audioOn=true; document.getElementById('soundBtn').textContent="소리 끄기";
}

/* ---------- controls ---------- */
document.getElementById('playBtn').addEventListener('click', e=>{
  playing=!playing; e.target.textContent = playing?"멈추기":"계속 가기";
});
const speeds=[1,0.5,1.6]; let speedIdx=0;
document.getElementById('speedBtn').addEventListener('click', e=>{
  speedIdx=(speedIdx+1)%speeds.length; speedMul=speeds[speedIdx];
  e.target.textContent = "속도 "+speedMul+"배";
});
document.getElementById('soundBtn').addEventListener('click', toggleAudio);
if(navigator.wakeLock){ navigator.wakeLock.request('screen').catch(()=>{}); } // 30분 켜두기용 화면 유지 시도

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  if(playing){ worldX += BASE_SPEED*speedMul*dt; elapsed += dt; }

  const camX = worldX - W*0.66;
  const pal = paletteAt(worldX);

  drawSky(pal);
  hillLayer(0.25, 30, 0.0016, pal.far, -118);
  hillLayer(0.5, 22, 0.0026, pal.mid, -52);
  drawGround(camX, pal);
  drawDecor(camX);
  drawTrack(camX);
  drawTrain(camX);

  // 전경: 빠르게 스치는 풀 (가까이 있다는 느낌)
  ctx.fillStyle = "rgba(0,0,0,.16)";
  const fcell=90, fc = worldX*1.25;
  for(let i=Math.floor(fc/fcell); i<Math.floor(fc/fcell)+Math.ceil(W/fcell)+2; i++){
    if(hash(i*3.1)<0.4) continue;
    const sx = i*fcell - fc + hash(i)*40;
    ctx.fillRect(sx, H-14-hash(i*7)*10, 3, 14);
  }

  const bi = biomeIndexAt(worldX);
  if(bi!==lastBiomeIdx){ lastBiomeIdx=bi; announce(biomeAt(worldX)); }
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(Math.floor(elapsed%60)).padStart(2,'0');
  clockEl.textContent = `${mm}:${ss}`;
  requestAnimationFrame(frame);
}
announce(BIOMES[0]);
requestAnimationFrame(frame);
</script>
