<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디든 가는 기차 — 힐링 프로토타입</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b132b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%}
  #title{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:#fff;font-size:14px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.45);opacity:.92;pointer-events:none}
  #title small{display:block;font-size:11px;opacity:.75;margin-top:2px}
  #region{position:fixed;top:22%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(20px,4.5vw,34px);
    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.5);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap}
  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.8;margin-top:6px}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;background:rgba(10,14,24,.38);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:999px;color:#fff}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;min-width:44px;text-align:center}
</style>
</head>

  <button id="playBtn">멈추기</button>

  <span id="clock">00:00</span>
</div>
