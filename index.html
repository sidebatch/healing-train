<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디든 가는 기차 — 아이소메트릭 프로토타입</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#20301f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,16,8,.28) 100%)}
  #title{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:#fff;font-size:14px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.55);opacity:.95;pointer-events:none}
  #title small{display:block;font-size:11px;opacity:.78;margin-top:2px}
  #region{position:fixed;top:20%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(20px,4.5vw,34px);
    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.65);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap}
  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.85;margin-top:6px}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:999px;color:#fff}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;min-width:44px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="title">어디든 가는 기차 · 아이소메트릭<small>프로토타입 v4 · 텍스처와 스프라이트로 다시 그린 버전, 배경이 빨리 바뀌는 테스트 버전입니다</small></div>
<div id="region"></div>
<div id="bar">
  <button id="playBtn">멈추기</button>
  <button id="speedBtn">속도 1배</button>
  <button id="soundBtn">소리 켜기</button>
  <span id="clock">00:00</span>
</div>

<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 1.6);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
function hash(n){ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerpColor(c1,c2,t){
  const a=hexRGB(c1), b=hexRGB(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
function shade(hex, f){ // f<1 어둡게, >1 밝게
  const a=hexRGB(hex);
  return `rgb(${clamp(Math.round(a[0]*f),0,255)},${clamp(Math.round(a[1]*f),0,255)},${clamp(Math.round(a[2]*f),0,255)})`;
}
function poly(points, fill, stroke){
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath(); ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}

/* ---------- biomes ---------- */
const BIOMES = [
  { name:"아침 초원", sub:"MEADOW", gA:"#7ab657", gB:"#6cab4d", tree:"#3e7d32", treeD:"#2c5c24", water:"#3f9fd8", sand:"#e6d29a", coast:0, night:0 },
  { name:"깊은 숲",   sub:"FOREST", gA:"#4f8a45", gB:"#457c3d", tree:"#26543a", treeD:"#173d29", water:"#3f9fd8", sand:"#e6d29a", coast:0, night:0 },
  { name:"바닷가",    sub:"COAST",  gA:"#79b657", gB:"#6cab4d", tree:"#357a3d", treeD:"#265c2c", water:"#3598d2", sand:"#ecd9a0", coast:1, night:0 },
  { name:"노을 사막", sub:"DESERT", gA:"#ddba68", gB:"#d2ad54", tree:"#4e7d3a", treeD:"#3a6129", water:"#3f9fd8", sand:"#e8cc85", coast:0, night:0.15 },
  { name:"눈 내리는 마을", sub:"SNOW", gA:"#f2f7fa", gB:"#e3eef5", tree:"#38604e", treeD:"#274739", water:"#7fb6cf", sand:"#ffffff", coast:0, night:0 },
  { name:"밤하늘 아래", sub:"NIGHT", gA:"#274434", gB:"#203a2c", tree:"#122a1e", treeD:"#0b1d14", water:"#1d3f5c", sand:"#4a5548", coast:0, night:1 },
];
const SEG = 2600, BLEND = 650;
function biomeIndexAt(x){ return Math.floor(x/SEG); }
function biomeAt(x){ const i=biomeIndexAt(x); return BIOMES[((i%BIOMES.length)+BIOMES.length)%BIOMES.length]; }
function paletteAt(x){
  const i = biomeIndexAt(x);
  const cur = BIOMES[((i%BIOMES.length)+BIOMES.length)%BIOMES.length];
  const nxt = BIOMES[(((i+1)%BIOMES.length)+BIOMES.length)%BIOMES.length];
  const into = x - i*SEG;
  const t0 = clamp((into-(SEG-BLEND))/BLEND, 0, 1);
  if(t0<=0) return cur;
  const t = t0*t0*(3-2*t0), o={ name:cur.name, sub:cur.sub };
  for(const k of ["gA","gB","tree","treeD","water","sand"]) o[k]=lerpColor(cur[k],nxt[k],t);
  o.coast = lerp(cur.coast, nxt.coast, t); o.night = lerp(cur.night, nxt.night, t);
  return o;
}

/* ---------- world geometry (아이소메트릭) ---------- */
const ISO_X = 0.92, ISO_Y = 0.46;
function meander(x){
  return Math.sin(x*0.0013)*210 + Math.sin(x*0.0031+1.3)*120 + Math.sin(x*0.00037+0.6)*240;
}
function dMeander(x){ return (meander(x+3)-meander(x-3))/6; }
function hill(x,y){
  return Math.sin(x*0.0011 + y*0.0006)*15 + Math.sin(y*0.0019 + x*0.0003)*9 + Math.sin((x+y)*0.00045)*11;
}
function trackZ(x){ return hill(x, meander(x)); }

let camPX=0, camPY=0;
const ZOOM = 0.7; // 카메라 배율 (1보다 작을수록 줌아웃)
let VIS = {x0:-400, y0:-400, x1:2000, y1:2000}; // 줌 적용 전 좌표 기준 보이는 범위
function proj(x,y,z){
  return [ (x-y)*ISO_X - camPX, (x+y)*ISO_Y - (z||0) - camPY ];
}

/* ---------- journey state ---------- */
let playing = true, speedMul = 1, worldX = 0, elapsed = 0, lastBiomeIdx = -1;
const BASE_SPEED = 60;
const smoke = [];
let smokePos = null;

const regionEl = document.getElementById('region');
const clockEl = document.getElementById('clock');
let regionTimer = null;
function announce(b){
  regionEl.innerHTML = `${b.name}<small>${b.sub}</small>`;
  regionEl.style.opacity = 1;
  clearTimeout(regionTimer);
  regionTimer = setTimeout(()=>{ regionEl.style.opacity = 0; }, 3400);
}

/* ---------- v4: 미리 그려두는 텍스처와 스프라이트 ---------- */
let _seed = 987654321;
function rnd(){ _seed = (_seed*16807)%2147483647; return (_seed-1)/2147483646; }
function makeCanvas(w,h){ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; return cv; }
function makeGroundTexture(pal, kind){
  const S=2, Wd=142*S, Hd=71*S, cv=makeCanvas(Wd,Hd), g=cv.getContext('2d');
  g.beginPath(); g.moveTo(Wd/2,0); g.lineTo(Wd,Hd/2); g.lineTo(Wd/2,Hd); g.lineTo(0,Hd/2); g.closePath(); g.clip();
  const base = kind==='water'? pal.water : kind==='sand'? pal.sand : pal.gA;
  const alt  = kind==='water'? pal.water : kind==='sand'? pal.sand : pal.gB;
  g.fillStyle = base; g.fillRect(0,0,Wd,Hd);
  for(let i=0;i<26;i++){
    g.fillStyle = alt; g.globalAlpha = 0.15+rnd()*0.2;
    const bx=rnd()*Wd, by=rnd()*Hd, br=(8+rnd()*26)*S;
    g.beginPath(); g.ellipse(bx,by,br,br*0.5,0,0,Math.PI*2); g.fill();
  }
  g.globalAlpha=1;
  for(let i=0;i<430;i++){
    g.fillStyle = rnd()>0.5 ? "rgba(0,0,0,0.10)" : "rgba(255,255,255,0.10)";
    g.fillRect(rnd()*Wd, rnd()*Hd, (1+rnd()*1.6)*S, (1+rnd())*S);
  }
  if(kind==='grass'||kind==='forest'){
    g.strokeStyle="rgba(0,70,0,0.20)"; g.lineWidth=1.1*S;
    for(let i=0;i<140;i++){ const px=rnd()*Wd, py=rnd()*Hd;
      g.beginPath(); g.moveTo(px,py); g.lineTo(px-1*S,py-3.4*S); g.stroke(); }
  }
  if(kind==='sand'){
    g.strokeStyle="rgba(120,90,30,0.18)"; g.lineWidth=1*S;
    for(let i=0;i<26;i++){ const px=rnd()*Wd, py=rnd()*Hd;
      g.beginPath(); g.arc(px,py,4*S+rnd()*5*S,Math.PI*1.15,Math.PI*1.7); g.stroke(); }
  }
  if(kind==='snow'){
    g.fillStyle="rgba(255,255,255,0.5)";
    for(let i=0;i<170;i++){ g.fillRect(rnd()*Wd, rnd()*Hd, 1.6*S, 1.6*S); }
    g.fillStyle="rgba(140,170,200,0.12)";
    for(let i=0;i<20;i++){ g.beginPath(); g.ellipse(rnd()*Wd,rnd()*Hd,10*S,4*S,0,0,Math.PI*2); g.fill(); }
  }
  if(kind==='water'){
    g.strokeStyle="rgba(255,255,255,0.35)"; g.lineWidth=1.2*S;
    for(let i=0;i<22;i++){ const px=rnd()*Wd, py=rnd()*Hd, ln=(6+rnd()*14)*S;
      g.beginPath(); g.moveTo(px,py); g.lineTo(px+ln,py-1.6*S); g.stroke(); }
  }
  return cv;
}
const TEX = {};
for(const b of BIOMES){
  const kind = b.sub==='DESERT'?'sand':b.sub==='SNOW'?'snow':b.sub==='FOREST'?'forest':'grass';
  TEX[b.sub] = [0,1,2].map(()=>makeGroundTexture(b, kind));
}
TEX.WATER = [0,1,2].map(()=>makeGroundTexture(BIOMES[2], 'water'));
TEX.SAND  = [0,1].map(()=>makeGroundTexture(BIOMES[2], 'sand'));
function tileKind(coastVal, sub, d){
  if(coastVal>0.55 && d>200) return 'WATER';
  if(coastVal>0.55 && d>120) return 'SAND';
  return sub;
}
function makeSprite(w,h,fn){
  const S=2, cv=makeCanvas(w*S,h*S), g=cv.getContext('2d');
  g.scale(S,S); fn(g,w,h); cv._w=w; cv._h=h; return cv;
}
function drawSprite(cv, x, yBottom, scale){
  const w=cv._w*scale, h=cv._h*scale;
  ctx.drawImage(cv, x-w/2, yBottom-h, w, h);
}
function foliageSpeckle(g, cx, cy, r, cols){
  for(let i=0;i<90;i++){
    const a=rnd()*Math.PI*2, rr2=Math.sqrt(rnd())*r;
    g.fillStyle = cols[Math.floor(rnd()*cols.length)];
    g.fillRect(cx+Math.cos(a)*rr2, cy+Math.sin(a)*rr2*0.82, 1.8, 1.8);
  }
}
function roundTreeSprite(main, dark, light){
  return makeSprite(78, 98, (g)=>{
    g.fillStyle="#5b4632"; g.fillRect(36,64,6,32);
    g.fillStyle="#4a3826"; g.fillRect(39,64,3,32);
    g.strokeStyle="#5b4632"; g.lineWidth=3.4;
    g.beginPath(); g.moveTo(39,70); g.lineTo(26,52); g.moveTo(39,68); g.lineTo(52,50); g.stroke();
    const blobs=[[39,28,21],[21,42,15],[57,42,15],[39,47,17],[27,25,13],[51,25,13]];
    for(const [x,y,r] of blobs){ g.fillStyle=dark; g.beginPath(); g.arc(x,y+4,r,0,Math.PI*2); g.fill(); }
    for(const [x,y,r] of blobs){ g.fillStyle=main; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
    for(const [x,y,r] of blobs) foliageSpeckle(g, x, y, r-2, [dark, light, main]);
    g.fillStyle="rgba(255,255,255,.20)"; g.beginPath(); g.arc(30,20,7,0,Math.PI*2); g.fill();
  });
}
function pineSprite(main, dark, snow){
  return makeSprite(66, 106, (g)=>{
    g.fillStyle="#5b4632"; g.fillRect(30.5,88,5,16);
    const layers=[[33,18,30],[33,40,24],[33,62,18.5],[33,82,13]];
    for(const [cx,top,hw] of layers){
      g.fillStyle=dark;
      g.beginPath(); g.moveTo(cx-hw, top+30); g.lineTo(cx+hw, top+30); g.lineTo(cx, top); g.closePath(); g.fill();
      g.fillStyle=main;
      g.beginPath(); g.moveTo(cx-hw+3, top+29); g.lineTo(cx+hw-3, top+29); g.lineTo(cx, top+3); g.closePath(); g.fill();
      if(snow){ g.fillStyle="rgba(255,255,255,.85)";
        g.beginPath(); g.moveTo(cx-hw*0.42, top+16); g.lineTo(cx+hw*0.42, top+16); g.lineTo(cx, top+3); g.closePath(); g.fill(); }
    }
    for(let i=0;i<70;i++){ g.fillStyle = rnd()>0.5? dark : main; g.fillRect(8+rnd()*50, 16+rnd()*76, 1.7, 1.7); }
    if(snow){ g.fillStyle="rgba(255,255,255,.9)"; for(let i=0;i<36;i++) g.fillRect(10+rnd()*46, 14+rnd()*70, 1.8, 1.8); }
  });
}
const SPR = {
  round: [ roundTreeSprite("#3e7d32","#2c5c24","#5da24a"), roundTreeSprite("#477f2e","#33591f","#6cab4a"), roundTreeSprite("#35705f","#234d41","#4f9c83") ],
  pine: pineSprite("#26543a","#173d29",false),
  pineSnow: pineSprite("#38604e","#274739",true),
  palm: makeSprite(86, 98, (g)=>{
    g.strokeStyle="#6b543a"; g.lineWidth=5; g.lineCap="round";
    g.beginPath(); g.moveTo(38,96); g.quadraticCurveTo(42,66, 50,44); g.stroke();
    g.strokeStyle="rgba(0,0,0,.18)"; g.lineWidth=1.4;
    for(let i=0;i<4;i++){ const yy=84-i*11; g.beginPath(); g.moveTo(37+i*1.1,yy); g.lineTo(45+i*1.3,yy-2); g.stroke(); }
    g.strokeStyle="#3e7d32"; g.lineWidth=3.4;
    for(let a=0;a<6;a++){
      const ang=-Math.PI*0.95+a*0.4, ex=50+Math.cos(ang)*30, ey=44+Math.sin(ang)*16+8;
      g.beginPath(); g.moveTo(50,44); g.quadraticCurveTo(50+Math.cos(ang)*17, 44+Math.sin(ang)*13-7, ex, ey); g.stroke();
      g.lineWidth=1.1; g.strokeStyle="#2c5c24";
      for(let t=0.3;t<0.95;t+=0.22){ const lx=50+Math.cos(ang)*30*t, ly=44+Math.sin(ang)*15*t+4*t;
        g.beginPath(); g.moveTo(lx,ly); g.lineTo(lx+3,ly+4.4); g.stroke(); }
      g.lineWidth=3.4; g.strokeStyle="#3e7d32";
    }
    g.fillStyle="#7a5c2e"; g.beginPath(); g.arc(46,47,3.4,0,Math.PI*2); g.arc(54,48,3,0,Math.PI*2); g.fill();
  }),
  cactus: makeSprite(54, 94, (g)=>{
    g.fillStyle="#4e7d3a"; g.beginPath(); g.roundRect(21,14,13,78,6); g.fill();
    g.fillStyle="#3a6129"; g.beginPath(); g.roundRect(28,14,6,78,3); g.fill();
    g.fillStyle="#4e7d3a";
    g.beginPath(); g.roundRect(6,36,7,26,3.5); g.fill(); g.fillRect(6,36,13,7);
    g.beginPath(); g.roundRect(41,28,7,32,3.5); g.fill(); g.fillRect(35,28,13,7);
    g.strokeStyle="rgba(255,255,255,.20)"; g.lineWidth=1.1;
    for(const lx of [24.5,31]){ g.beginPath(); g.moveTo(lx,18); g.lineTo(lx,88); g.stroke(); }
    g.fillStyle="#ffb7d5"; g.beginPath(); g.arc(27.5,12,3.6,0,Math.PI*2); g.fill();
    g.fillStyle="rgba(255,255,255,.5)";
    for(let i=0;i<16;i++) g.fillRect(22+rnd()*11, 20+rnd()*66, 1.2, 1.2);
  }),
};
function isoHouseSprite(wall, wallD, roof, roofD){
  return makeSprite(124, 108, (g)=>{
    const ex=[0.92,0.46], ey=[-0.92,0.46], cx=62, by=100, w=34, d=30, hgt=34;
    const B=[cx,by], X=[cx+ex[0]*w, by+ex[1]*w], Y=[cx+ey[0]*d, by+ey[1]*d], XY=[cx+ex[0]*w+ey[0]*d, by+ex[1]*w+ey[1]*d];
    const up=p=>[p[0],p[1]-hgt];
    const P=(pts,fill)=>{ g.fillStyle=fill; g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fill(); };
    P([Y,XY,up(XY),up(Y)], wallD);
    P([X,XY,up(XY),up(X)], wall);
    // 벽 판자 결
    g.strokeStyle="rgba(0,0,0,.10)"; g.lineWidth=1;
    for(let i=1;i<4;i++){ const yy=by-hgt*i/4;
      g.beginPath(); g.moveTo(cx+ey[0]*d, yy+ey[1]*d); g.lineTo(cx+ex[0]*w+ey[0]*d, yy+ex[1]*w+ey[1]*d); g.stroke();
      g.beginPath(); g.moveTo(cx+ex[0]*w, yy+ex[1]*w); g.lineTo(cx+ex[0]*w+ey[0]*d, yy+ex[1]*w+ey[1]*d); g.stroke(); }
    // 지붕 (살짝 오버행 + 기와 줄)
    const o=5, upR=p=>[p[0],p[1]-hgt-9];
    const RB=[cx-ex[0]*o-ey[0]*o, by-ex[1]*o-ey[1]*o], RX=[cx+ex[0]*(w+o)-ey[0]*o, by+ex[1]*(w+o)-ey[1]*o],
          RY=[cx+ey[0]*(d+o)-ex[0]*o, by+ey[1]*(d+o)-ex[1]*o], RXY=[cx+ex[0]*(w+o)+ey[0]*(d+o), by+ex[1]*(w+o)+ey[1]*(d+o)];
    P([RY,RXY,upR(RXY),upR(RY)], roofD);
    P([RX,RXY,upR(RXY),upR(RX)], roof);
    P([upR(RB),upR(RX),upR(RXY),upR(RY)], roof);
    g.strokeStyle="rgba(0,0,0,.16)"; g.lineWidth=1;
    for(let i=1;i<4;i++){ const t=i/4;
      const a1=[upR(RB)[0]+(upR(RY)[0]-upR(RB)[0])*t, upR(RB)[1]+(upR(RY)[1]-upR(RB)[1])*t];
      const a2=[upR(RX)[0]+(upR(RXY)[0]-upR(RX)[0])*t, upR(RX)[1]+(upR(RXY)[1]-upR(RX)[1])*t];
      g.beginPath(); g.moveTo(a1[0],a1[1]); g.lineTo(a2[0],a2[1]); g.stroke(); }
    // 굴뚝
    g.fillStyle="#6e4a35"; g.fillRect(cx+6, by-hgt-24, 7, 15);
    g.fillStyle="#54382a"; g.fillRect(cx+6, by-hgt-24, 7, 3.4);
    // 문 + 창문
    g.fillStyle="#4a3222"; g.fillRect(cx+13, by-17, 8, 17);
    g.fillStyle="#ffd97a"; g.fillRect(cx-14, by-24, 7.6, 8.6); g.fillRect(cx+24, by-19, 7.6, 8.6);
    g.strokeStyle="rgba(90,60,30,.8)"; g.lineWidth=1;
    g.strokeRect(cx-14, by-24, 7.6, 8.6); g.strokeRect(cx+24, by-19, 7.6, 8.6);
  });
}
SPR.house = [ isoHouseSprite("#efe3cc","#d9c8a6","#b0512f","#93401f"), isoHouseSprite("#dfe9ef","#bccdd6","#4c6076","#3a4c60") ];

/* ---------- ground tiles ---------- */
const TILE = 72;
function drawGround(){
  const cx = worldX, cy = meander(worldX), R = Math.max(W,H)/ZOOM*1.25;
  const tiles = [];
  const gi0 = Math.floor((cx-R)/TILE), gi1 = Math.floor((cx+R)/TILE);
  const gj0 = Math.floor((cy-R)/TILE), gj1 = Math.floor((cy+R)/TILE);
  for(let gi=gi0; gi<=gi1; gi++) for(let gj=gj0; gj<=gj1; gj++){
    const x = gi*TILE+TILE/2, y = gj*TILE+TILE/2;
    const p = proj(x,y,hill(x,y));
    if(p[0]<VIS.x0 || p[0]>VIS.x1 || p[1]<VIS.y0 || p[1]>VIS.y1) continue;
    tiles.push([x+y, gi, gj, x, y]);
  }
  tiles.sort((a,b)=>a[0]-b[0]);
  for(const [,gi,gj,x,y] of tiles){
    const h = hash(gi*57.3 + gj*131.7);
    const d = y - meander(x); // 선로에서 남쪽(+)으로 얼마나 떨어졌나
    const z = hill(x,y);
    const c = proj(x,y,z);
    const bi = biomeIndexAt(x);
    const curB = BIOMES[((bi%BIOMES.length)+BIOMES.length)%BIOMES.length];
    const nxtB = BIOMES[(((bi+1)%BIOMES.length)+BIOMES.length)%BIOMES.length];
    const kind = tileKind(curB.coast, curB.sub, d);
    const arr = TEX[kind];
    const variant = kind==='WATER' ? (Math.floor(h*3)+Math.floor(elapsed*0.6))%3 : Math.floor(h*arr.length);
    ctx.drawImage(arr[variant], c[0]-70.8, c[1]-35.4, 141.6, 70.8);
    // 컨셉 경계에서는 다음 텍스처를 겹쳐 서서히 섞기
    const into = x - bi*SEG;
    const t0 = clamp((into-(SEG-BLEND))/BLEND, 0, 1);
    if(t0>0 && t0<1){
      const nk = tileKind(nxtB.coast, nxtB.sub, d);
      if(nk !== kind){
        const narr = TEX[nk];
        ctx.globalAlpha = t0*t0*(3-2*t0);
        ctx.drawImage(narr[Math.floor(h*narr.length)], c[0]-70.8, c[1]-35.4, 141.6, 70.8);
        ctx.globalAlpha = 1;
      }
    }
    // 타일 경계선
    const s = TILE/2*1.07;
    const c1 = proj(x-s, y-s, z), c2 = proj(x+s, y-s, z), c3 = proj(x+s, y+s, z), c4 = proj(x-s, y+s, z);
    poly([c1,c2,c3,c4], "rgba(0,0,0,0)", "rgba(0,0,0,.05)");
    // 초원 꽃 (가끔)
    const h2 = hash(gi*17.9 + gj*71.3);
    if(h2 < 0.045 && kind==='MEADOW'){
      ctx.fillStyle = h>0.5 ? "#ffb7d5" : "#fff6f9";
      ctx.beginPath(); ctx.arc(c[0]+(h-0.5)*26, c[1]+(h2-0.02)*40, 2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(c[0]-(h-0.5)*20, c[1]-(h2)*30, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }
}

/* ---------- decorations ---------- */
function drawTreeAt(sx, sy, s, pal, kind, r){
  if(kind==='cactus') drawSprite(SPR.cactus, sx, sy, s*0.52);
  else if(kind==='palm') drawSprite(SPR.palm, sx, sy, s*0.62);
  else if(kind==='pineSnow') drawSprite(SPR.pineSnow, sx, sy, s*0.6);
  else if(kind==='pine') drawSprite(SPR.pine, sx, sy, s*0.6);
  else drawSprite(SPR.round[Math.floor(r*SPR.round.length)%SPR.round.length], sx, sy, s*0.62);
}
function drawHouseAt(sx, sy, s, pal, r){
  drawSprite(SPR.house[Math.floor((r||0)*SPR.house.length)%SPR.house.length], sx, sy, s*0.86);
}
function collectDecor(){
  const back=[], front=[];
  const cell=150, cx=worldX, cy=meander(worldX), R=Math.max(W,H)/ZOOM*1.25;
  const i0=Math.floor((cx-R)/cell), i1=Math.floor((cx+R)/cell);
  const j0=Math.floor((cy-R)/cell), j1=Math.floor((cy+R)/cell);
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){
    const r = hash(i*91.7 + j*47.3);
    const ox = i*cell + hash(i*3.1+j)*70, oy = j*cell + hash(j*5.7+i)*70;
    const dist = oy - meander(ox);
    if(Math.abs(dist) < 58 || Math.abs(dist) > 640) continue;
    const name = biomeAt(ox).sub;
    let density = 0.42;
    if(name==='FOREST') density=0.78; else if(name==='DESERT') density=0.2;
    else if(name==='COAST') density=0.26; else if(name==='NIGHT') density=0.5;
    if(r > density) continue;
    const p = proj(ox, oy, hill(ox,oy));
    if(p[0]<VIS.x0 || p[0]>VIS.x1 || p[1]<VIS.y0 || p[1]>VIS.y1) continue;
    const tr = hash(i*31.7 + j*17.9); // 종류 선택은 밀도 판정과 별개 값으로 (같은 값 쓰면 집·야자수 등이 영영 안 나옴)
    const item = { x:p[0], y:p[1], s:0.85+hash(i*7+j*13)*0.5, pal:paletteAt(ox), name, r:tr, depth:ox+oy };
    (dist<0?back:front).push(item);
  }
  back.sort((a,b)=>a.depth-b.depth); front.sort((a,b)=>a.depth-b.depth);
  return {back, front};
}
function drawDecorItem(it){
  const {x,y,s,pal,name,r} = it;
  // 땅 그림자 (입체감)
  ctx.fillStyle = "rgba(0,0,0,.15)";
  ctx.beginPath(); ctx.ellipse(x, y+2.4, 13*s, 4.6*s, 0, 0, Math.PI*2); ctx.fill();
  if(name==='DESERT'){ if(r>0.45) drawTreeAt(x,y,s,pal,'cactus',r);
    else { ctx.fillStyle="rgba(120,90,50,.55)"; ctx.beginPath(); ctx.ellipse(x,y-3*s,11*s,4.5*s,0,0,Math.PI*2); ctx.fill(); } }
  else if(name==='COAST'){ drawTreeAt(x,y,s,pal, r>0.55?'palm':'round', r); }
  else if(name==='FOREST'){ drawTreeAt(x,y,s*1.2,pal,'pine',r); }
  else if(name==='SNOW'){ drawTreeAt(x,y,s*1.05,pal,'pineSnow',r); }
  else if(name==='NIGHT'){
    if(r>0.62) drawHouseAt(x,y,s,pal,r);
    else if(r>0.5){ // 가로등
      ctx.strokeStyle="#0d1521"; ctx.lineWidth=2.4*s;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-24*s); ctx.stroke();
      ctx.save(); ctx.fillStyle="#ffd97a"; ctx.shadowColor="#ffd97a"; ctx.shadowBlur=13;
      ctx.beginPath(); ctx.arc(x,y-26*s,3*s,0,Math.PI*2); ctx.fill(); ctx.restore();
    } else drawTreeAt(x,y,s*1.1,pal,'pine',r);
  }
  else { // MEADOW
    if(r>0.8) drawHouseAt(x,y,s,pal,r); else drawTreeAt(x,y,s,pal,'round',r);
  }
}

/* ---------- track ---------- */
function trackPoints(){
  const pts=[];
  for(let x=worldX-1950; x<=worldX+2250; x+=14){
    const m = dMeander(x), inv = 1/Math.sqrt(1+m*m);
    const px = -m*inv, py = inv; // 진행 방향에 수직인 월드 벡터
    pts.push({x, y:meander(x), z:trackZ(x)+3, px, py});
  }
  return pts;
}
function drawTrack(){
  const pts = trackPoints();
  // 노반
  const left = pts.map(p=>proj(p.x+p.px*17, p.y+p.py*17, p.z));
  const right = pts.map(p=>proj(p.x-p.px*17, p.y-p.py*17, p.z)).reverse();
  poly(left.concat(right), "#6f6459");
  // 자갈 반점
  for(let i=0;i<pts.length;i+=3){
    const p=pts[i], hh=hash(i*13.7);
    const sp=proj(p.x+p.px*(hh*22-11), p.y+p.py*(hh*22-11), p.z+0.3);
    ctx.fillStyle = hh>0.5 ? "rgba(255,255,255,.09)" : "rgba(0,0,0,.13)";
    ctx.fillRect(sp[0]-1.3, sp[1]-1, 2.6, 2);
  }
  // 침목
  ctx.strokeStyle = "#4c3a28"; ctx.lineWidth = 4.4;
  for(let i=0;i<pts.length;i+=2){
    const p=pts[i];
    const a=proj(p.x+p.px*14, p.y+p.py*14, p.z+0.6), b=proj(p.x-p.px*14, p.y-p.py*14, p.z+0.6);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  // 레일 2줄 (그림자 먼저, 그 위에 밝은 금속선)
  for(const off of [7,-7]){
    ctx.strokeStyle = "rgba(30,30,34,.4)"; ctx.lineWidth = 3.1; ctx.beginPath();
    pts.forEach((p,i)=>{ const s=proj(p.x+p.px*off, p.y+p.py*off, p.z+0.7); i===0?ctx.moveTo(s[0],s[1]):ctx.lineTo(s[0],s[1]); });
    ctx.stroke();
    ctx.strokeStyle = "#e3eaf1"; ctx.lineWidth = 2.2; ctx.beginPath();
    pts.forEach((p,i)=>{ const s=proj(p.x+p.px*off, p.y+p.py*off, p.z+1.6); i===0?ctx.moveTo(s[0],s[1]):ctx.lineTo(s[0],s[1]); });
    ctx.stroke();
  }
  // 신호기 (가끔)
  for(let gx=Math.floor((worldX-1900)/560)*560; gx<worldX+2200; gx+=560){
    const y = meander(gx), m=dMeander(gx), inv=1/Math.sqrt(1+m*m);
    const ox = gx + (-m*inv)*-26, oy = y + inv*-26;
    const p = proj(ox, oy, hill(ox,oy));
    if(p[0]<VIS.x0||p[0]>VIS.x1) continue;
    ctx.strokeStyle="#22282e"; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0],p[1]-21); ctx.stroke();
    ctx.fillStyle="#39e07a"; ctx.beginPath(); ctx.arc(p[0],p[1]-24,3,0,Math.PI*2); ctx.fill();
  }
}

/* ---------- train (6량, 아이소 박스) ---------- */
const CAR_COLORS = ["#31556e","#7a4b3a","#4a6741","#6b5b8f","#8a6d3b","#546e7a"];
function carPositions(){
  const pos=[worldX];
  let x=worldX;
  for(let i=1;i<6;i++){ const m=dMeander(x); x -= 122/Math.sqrt(1+m*m); pos.push(x); }
  return pos;
}
function drawCar(x, idx){
  const y = meander(x), z = trackZ(x)+4;
  const m = dMeander(x), inv = 1/Math.sqrt(1+m*m);
  const tx = inv, ty = m*inv;                       // 월드 진행 단위벡터
  const vx = (tx-ty)*ISO_X, vy = (tx+ty)*ISO_Y;     // 화면 진행 벡터 (단위 길이당)
  const vlen = Math.hypot(vx,vy);
  const ux = vx/vlen, uy = vy/vlen, px = -uy, py = ux;
  const c = proj(x,y,z);
  const L = 102*vlen, Wd = 30, Hgt = 27;
  const sideSign = py>0?1:-1;
  const A = [c[0]-ux*L/2, c[1]-uy*L/2], B = [c[0]+ux*L/2, c[1]+uy*L/2];
  const off = [px*sideSign*Wd/2, py*sideSign*Wd/2];
  const A2=[A[0]+off[0],A[1]+off[1]], B2=[B[0]+off[0],B[1]+off[1]];
  const up = p=>[p[0],p[1]-Hgt];
  const base = CAR_COLORS[idx];
  const night = paletteAt(x).night;
  if(idx===0 && night>0.35){ // 밤에는 전조등 불빛
    const F=[B2[0]+ux*3, B2[1]-11], tip=[F[0]+ux*120, F[1]+uy*120];
    const pp=[px*30, py*30];
    poly([F, [tip[0]+pp[0], tip[1]+pp[1]], [tip[0]-pp[0], tip[1]-pp[1]]], `rgba(255,244,190,${0.12*night})`);
  }
  // 바퀴 그림자 + 대차(바퀴 뭉치)
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(c[0], c[1]+3, L*0.52, 6, Math.atan2(uy,ux), 0, Math.PI*2); ctx.fill();
  ctx.fillStyle="#14181d";
  for(const bt of [-0.3, 0.3]){
    ctx.beginPath(); ctx.ellipse(c[0]+ux*L*bt+off[0]*0.7, c[1]+uy*L*bt+off[1]*0.7+1.5, 13.5, 4.6, Math.atan2(uy,ux), 0, Math.PI*2); ctx.fill();
  }
  // 끝면 (뒤쪽 칸 연결부 반대편)
  const endAtFront = uy>0;
  const E1 = endAtFront? B2:A2;
  const F1 = endAtFront? [B[0]-off[0], B[1]-off[1]] : [A[0]-off[0], A[1]-off[1]];
  poly([E1, F1, up(F1), up(E1)], shade(base, 0.72));
  if(idx===0 && endAtFront){ // 기관차 앞면 보일러 원
    const fc = [(E1[0]+F1[0])/2, (E1[1]+F1[1])/2 - Hgt/2];
    ctx.fillStyle="#1d2126"; ctx.beginPath(); ctx.arc(fc[0], fc[1], 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle="#c9a227"; ctx.lineWidth=1.6; ctx.stroke();
  }
  // 옆면 (위아래 그라데이션) + 몸통 띠 + 패널 이음선
  const grad = ctx.createLinearGradient(0, c[1]-Hgt, 0, c[1]);
  grad.addColorStop(0, shade(base, 1.13)); grad.addColorStop(1, shade(base, 0.8));
  poly([A2, B2, up(B2), up(A2)], grad);
  poly([[A2[0],A2[1]-10],[B2[0],B2[1]-10],[B2[0],B2[1]-6.8],[A2[0],A2[1]-6.8]], "rgba(255,255,255,.2)");
  ctx.strokeStyle="rgba(0,0,0,.16)"; ctx.lineWidth=1;
  for(const st of [-0.475, 0.475]){
    ctx.beginPath();
    ctx.moveTo(c[0]+ux*L*st+off[0], c[1]+uy*L*st+off[1]-Hgt+2.4);
    ctx.lineTo(c[0]+ux*L*st+off[0], c[1]+uy*L*st+off[1]-2.4);
    ctx.stroke();
  }
  // 지붕(윗면) + 지붕 골
  const ATopIn = [A[0]-off[0], A[1]-off[1]], BTopIn = [B[0]-off[0], B[1]-off[1]];
  poly([up(A2), up(B2), up(BTopIn), up(ATopIn)], shade(base, 1.22));
  ctx.strokeStyle="rgba(0,0,0,.14)";
  for(const rt of [-0.26, 0, 0.26]){
    ctx.beginPath();
    ctx.moveTo(c[0]+ux*L*rt+off[0], c[1]+uy*L*rt+off[1]-Hgt);
    ctx.lineTo(c[0]+ux*L*rt-off[0], c[1]+uy*L*rt-off[1]-Hgt);
    ctx.stroke();
  }
  // 창문 (틀 + 안쪽 빛)
  const winCol = night>0.4 ? "#ffd97a" : "#ffefc4";
  const n = idx===0?2:4;
  for(let i=0;i<n;i++){
    const t = -0.36 + i*(0.72/Math.max(n-1,1)) || 0;
    const cxp = c[0]+ux*L*t + off[0], cyp = c[1]+uy*L*t + off[1] - Hgt + 7;
    const fH = [ux*8.2, uy*8.2], iH = [ux*6.4, uy*6.4];
    poly([[cxp-fH[0], cyp-fH[1]], [cxp+fH[0], cyp+fH[1]], [cxp+fH[0], cyp+fH[1]+11], [cxp-fH[0], cyp-fH[1]+11]], "#22303c");
    poly([[cxp-iH[0], cyp-iH[1]+1.6], [cxp+iH[0], cyp+iH[1]+1.6], [cxp+iH[0], cyp+iH[1]+9.4], [cxp-iH[0], cyp-iH[1]+9.4]], winCol);
    // 창문 빛 반사
    poly([[cxp-iH[0], cyp-iH[1]+1.6], [cxp-iH[0]+iH[0]*0.9, cyp-iH[1]+1.6], [cxp-iH[0], cyp-iH[1]+6]], "rgba(255,255,255,.25)");
  }
  if(idx===0){
    // 운전실 + 황동 돔 + 굴뚝 + 전조등
    const fx = B[0]-ux*14+off[0], fy = B[1]-uy*14+off[1];
    ctx.fillStyle = "#c9a227";
    ctx.beginPath(); ctx.arc(fx-17, fy-Hgt+1, 5.4, Math.PI, 0); ctx.fill();
    ctx.fillStyle = shade(base, 0.8); ctx.fillRect(fx-8, fy-Hgt-11, 17, 12);
    ctx.fillStyle = "#20262c"; ctx.fillRect(fx+2, fy-Hgt-21, 6.5, 11);
    ctx.save(); ctx.fillStyle="#ffe27a"; ctx.shadowColor="#ffe27a"; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.arc(B2[0]+ux*2, B2[1]-10, 3.2, 0, Math.PI*2); ctx.fill(); ctx.restore();
    smokePos = [fx+5, fy-Hgt-24];
  }
}
function drawTrain(){
  const pos = carPositions();
  for(let idx=5; idx>=0; idx--) drawCar(pos[idx], idx);
  if(playing && smokePos && Math.random()<0.4) smoke.push({x:smokePos[0], y:smokePos[1], r:4.5, life:1});
  for(let i=smoke.length-1;i>=0;i--){
    const p=smoke[i]; p.x-=0.3; p.y-=0.6; p.r+=0.22; p.life-=0.012;
    if(p.life<=0){ smoke.splice(i,1); continue; }
    ctx.fillStyle=`rgba(255,255,255,${0.32*p.life})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
}

/* ---------- audio: 잔잔한 패드 (선택) ---------- */
let audioCtx=null, audioOn=false, padTimer=null;
function toggleAudio(){
  if(audioOn){
    audioOn=false; clearInterval(padTimer); if(audioCtx) audioCtx.close(); audioCtx=null;
    document.getElementById('soundBtn').textContent="소리 켜기"; return;
  }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const chords = [[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];
  let ci=0;
  const playChord=()=>{
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    chords[ci%chords.length].forEach(f=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+1.6);
      g.gain.linearRampToValueAtTime(0.0001,t+7.8);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+8);
    });
    ci++;
  };
  playChord(); padTimer=setInterval(playChord, 7000);
  audioOn=true; document.getElementById('soundBtn').textContent="소리 끄기";
}

/* ---------- controls ---------- */
document.getElementById('playBtn').addEventListener('click', e=>{
  playing=!playing; e.target.textContent = playing?"멈추기":"계속 가기";
});
const speeds=[1,0.5,1.6]; let speedIdx=0;
document.getElementById('speedBtn').addEventListener('click', e=>{
  speedIdx=(speedIdx+1)%speeds.length; speedMul=speeds[speedIdx];
  e.target.textContent = "속도 "+speedMul+"배";
});
document.getElementById('soundBtn').addEventListener('click', toggleAudio);
if(navigator.wakeLock){ navigator.wakeLock.request('screen').catch(()=>{}); }

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  if(playing){ worldX += BASE_SPEED*speedMul*dt; elapsed += dt; }

  // 카메라: 기관차가 화면의 42% / 46% 지점에 오도록
  const hx = worldX, hy = meander(worldX), hz = trackZ(worldX);
  camPX = (hx-hy)*ISO_X - W*0.42;
  camPY = (hx+hy)*ISO_Y - hz - H*0.46;

  // 줌아웃: 기차가 있는 지점을 중심으로 화면 전체를 축소해 더 넓게 보여줌
  const ax = W*0.42, ay = H*0.46;
  VIS.x0 = ax - ax/ZOOM - 170; VIS.x1 = ax + (W-ax)/ZOOM + 170;
  VIS.y0 = ay - ay/ZOOM - 170; VIS.y1 = ay + (H-ay)/ZOOM + 170;
  const palNow = paletteAt(worldX);
  ctx.fillStyle = palNow.gA; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(ax, ay); ctx.scale(ZOOM, ZOOM); ctx.translate(-ax, -ay);
  drawGround();
  // 구름 그림자가 땅 위를 천천히 흘러감 (밤에는 없음)
  if(palNow.night < 0.5){
    ctx.fillStyle = `rgba(15,35,20,${0.07*(1-palNow.night)})`;
    const vw = VIS.x1-VIS.x0, vh = Math.max(VIS.y1-VIS.y0, 1);
    for(let i=0;i<4;i++){
      const ccx = VIS.x0 + ((elapsed*20 + i*1130) % (vw+520)) - 260;
      const ccy = VIS.y0 + ((i*613) % vh);
      ctx.beginPath(); ctx.ellipse(ccx, ccy, 190, 58, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  const decor = collectDecor();
  decor.back.forEach(drawDecorItem);
  drawTrack();
  drawTrain();
  decor.front.forEach(drawDecorItem);
  ctx.restore();

  const bi = biomeIndexAt(worldX);
  if(bi!==lastBiomeIdx){ lastBiomeIdx=bi; announce(biomeAt(worldX)); }
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(Math.floor(elapsed%60)).padStart(2,'0');
  clockEl.textContent = `${mm}:${ss}`;
  requestAnimationFrame(frame);
}
announce(BIOMES[0]);
requestAnimationFrame(frame);
</script>
</body>
