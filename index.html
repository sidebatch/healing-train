<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d1626;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block}
  #title{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:#fff;font-size:14px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.55);opacity:.95;pointer-events:none;z-index:5}
  #title small{display:block;font-size:11px;opacity:.78;margin-top:2px}
  #title a{color:#cfe6ff;pointer-events:auto;text-decoration:none;border-bottom:1px dotted #cfe6ff}
  #region{position:fixed;top:20%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(20px,4.5vw,34px);
    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.65);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap;z-index:5}
  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.85;margin-top:6px}
  #ui{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:8px;max-width:97vw}
  #bar{display:flex;flex-direction:column;gap:6px;align-items:center;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:24px;color:#fff;max-width:97vw;justify-content:center}
  #bar .brow{display:flex;gap:8px;align-items:center;justify-content:center}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 13px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;min-width:44px;text-align:center}
  #sleepPanel,#soundPanel{display:none;flex-direction:column;gap:9px;background:rgba(10,14,24,.58);backdrop-filter:blur(8px);
    padding:12px 14px;border-radius:18px;color:#fff;width:min(92vw,350px)}
  #sleepPanel .srow,#soundPanel .srow{display:flex;align-items:center;gap:8px}
  #sleepPanel .slab,#soundPanel .slab{font-size:12.5px;width:58px;flex:none;opacity:.92}
  #sleepPanel .sval,#soundPanel .sval{font-size:12px;min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
  #sleepPanel input[type=range],#soundPanel input[type=range]{flex:1;accent-color:#ffd9a0;height:22px}
  #sleepChips{display:flex;gap:6px;flex-wrap:wrap}
  #sleepChips button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;padding:6px 11px;font-size:12.5px;cursor:pointer}
  #sleepChips button.on{background:#fff;color:#16222e;font-weight:700}
  #sleepLeft{font-size:12px;opacity:.85;min-height:15px}
  #sleepCustom{flex:1;background:rgba(255,255,255,.14);border:0;border-radius:999px;color:#fff;padding:7px 12px;font-size:13px;min-width:0}
  #sleepCustom::placeholder{color:rgba(255,255,255,.55)}
  #sleepCustomBtn,#sleepCancel,#soundToggle{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;padding:7px 13px;font-size:12.5px;cursor:pointer;flex:none}
  #sleepEnd{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(5,8,14,.9);color:#fff;z-index:8;text-align:center;padding:20px}
  #sleepEnd .big{font-size:26px;letter-spacing:.12em}
  #sleepEnd .sub{font-size:13.5px;opacity:.8}
  #sleepEnd button{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:10px 22px;font-size:14px;cursor:pointer}
  #mapbar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);padding:7px 10px;border-radius:22px;
    width:min(94vw,520px)}
  @media (max-width:560px){
    #bar button{padding:7px 10px;font-size:12px}
    #mapbar button{padding:6px 10px;font-size:12px}
  }
  #mapbar::-webkit-scrollbar{display:none}
  #mapbar button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  #mapbar button.on{background:#fff;color:#16222e;font-weight:700}
  #credit{color:rgba(255,255,255,.55);font-size:10.5px;letter-spacing:.04em;text-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none}
  #err{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);max-width:86vw;background:rgba(120,20,20,.92);color:#fff;
    padding:14px 18px;border-radius:12px;font-size:13px;line-height:1.5;display:none;z-index:9;white-space:pre-wrap}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#dfeaf5;font-size:15px;letter-spacing:.06em;z-index:4}
</style>
</head>
<body>
<div id="loading">세상을 만드는 중...</div>
<div id="title">어디든 가는 기차</div>
<div id="region"></div>
<div id="mapcredit" style="display:none;position:fixed;left:8px;top:58px;color:rgba(255,255,255,.85);font-size:10px;z-index:5;text-shadow:0 1px 3px rgba(0,0,0,.5)">지도 · © OpenStreetMap contributors (ODbL) / 지형 · AWS Terrain Tiles · 위성 · Esri World Imagery<span id="satstat"></span></div>
<div id="nextpoi" style="display:none;position:fixed;right:10px;bottom:64px;color:#fff;font-size:12px;line-height:1.7;text-align:right;z-index:5;text-shadow:0 1px 4px rgba(0,0,0,.65)"></div>
<div id="err"></div>
<div id="sleepEnd"><div class="big">잘자요</div><div class="sub">잠시 쉬는 중...</div><button id="sleepRestart">다시 시작</button></div>
<div id="ui">
<div id="mapbar"></div>
<div id="credit">© 2026 sidebatch · <span id="appver"></span><span id="visits"></span></div>
<div id="sleepPanel">
  <div class="srow"><span class="slab">수면 타이머</span><div id="sleepChips"><button data-min="0" class="on">끔</button><button data-min="15">15분</button><button data-min="30">30분</button><button data-min="60">60분</button></div></div>
  <div class="srow"><span class="slab">직접 설정</span><input type="number" id="sleepCustom" min="1" max="180" inputmode="numeric" placeholder="분 (1~180)"><button id="sleepCustomBtn">설정</button></div>
  <div class="srow"><div id="sleepLeft" style="flex:1">타이머가 끝나면 소리가 서서히 줄고 기차가 멈춰요</div><button id="sleepCancel" style="display:none">취소</button></div>
</div>
<div id="soundPanel">
  <div class="srow"><span class="slab">소리</span><button id="soundToggle">소리 켜기</button></div>
  <div class="srow"><span class="slab">음악</span><input type="range" id="mixMusic" min="0" max="100" value="85"><span class="sval" id="mixMusicV">85</span></div>
  <div class="srow"><span class="slab">바람 소리</span><input type="range" id="mixWind" min="0" max="100" value="35"><span class="sval" id="mixWindV">35</span></div>
  <div class="srow"><span class="slab">기차 소리</span><input type="range" id="mixTrain" min="0" max="100" value="40"><span class="sval" id="mixTrainV">40</span></div>
</div>
<div id="bar">
  <div class="brow">
  <button id="playBtn">멈추기</button>
  <button id="camBtn">카메라: 영화</button>
  <button id="speedBtn">속도 1배</button>
  <button id="trainBtn">기차: 기본</button>
  </div>
  <div class="brow">
  <button id="soundBtn">소리 설정</button>
  <button id="sleepBtn">수면</button>
  <span id="clock">00:00</span>
  </div>
</div>
</div>
