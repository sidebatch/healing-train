<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디든 가는 기차 — 아이소메트릭 프로토타입</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#20301f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,16,8,.28) 100%)}
  #title{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:#fff;font-size:14px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.55);opacity:.95;pointer-events:none}
  #title small{display:block;font-size:11px;opacity:.78;margin-top:2px}
  #region{position:fixed;top:20%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(20px,4.5vw,34px);
    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.65);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap}
  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.85;margin-top:6px}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:999px;color:#fff}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;min-width:44px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="title">어디든 가는 기차 · 아이소메트릭<small>프로토타입 v2 · 배경이 빨리 바뀌는 테스트 버전입니다</small></div>
<div id="region"></div>
<div id="bar">
  <button id="playBtn">멈추기</button>
  <button id="speedBtn">속도 1배</button>
  <button id="soundBtn">소리 켜기</button>
  <span id="clock">00:00</span>
</div>

<script>
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 1.6);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
function hash(n){ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hexRGB(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lerpColor(c1,c2,t){
  const a=hexRGB(c1), b=hexRGB(c2);
  return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;
}
function shade(hex, f){ // f<1 어둡게, >1 밝게
  const a=hexRGB(hex);
  return `rgb(${clamp(Math.round(a[0]*f),0,255)},${clamp(Math.round(a[1]*f),0,255)},${clamp(Math.round(a[2]*f),0,255)})`;
}
function poly(points, fill){
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath(); ctx.fill();
}

/* ---------- biomes ---------- */
const BIOMES = [
  { name:"아침 초원", sub:"MEADOW", gA:"#7ab657", gB:"#6cab4d", tree:"#3e7d32", treeD:"#2c5c24", water:"#3f9fd8", sand:"#e6d29a", coast:0, night:0 },
  { name:"깊은 숲",   sub:"FOREST", gA:"#4f8a45", gB:"#457c3d", tree:"#26543a", treeD:"#173d29", water:"#3f9fd8", sand:"#e6d29a", coast:0, night:0 },
  { name:"바닷가",    sub:"COAST",  gA:"#79b657", gB:"#6cab4d", tree:"#357a3d", treeD:"#265c2c", water:"#3598d2", sand:"#ecd9a0", coast:1, night:0 },
  { name:"노을 사막", sub:"DESERT", gA:"#ddba68", gB:"#d2ad54", tree:"#4e7d3a", treeD:"#3a6129", water:"#3f9fd8", sand:"#e8cc85", coast:0, night:0.15 },
  { name:"눈 내리는 마을", sub:"SNOW", gA:"#f2f7fa", gB:"#e3eef5", tree:"#38604e", treeD:"#274739", water:"#7fb6cf", sand:"#ffffff", coast:0, night:0 },
  { name:"밤하늘 아래", sub:"NIGHT", gA:"#274434", gB:"#203a2c", tree:"#122a1e", treeD:"#0b1d14", water:"#1d3f5c", sand:"#4a5548", coast:0, night:1 },
];
const SEG = 2600, BLEND = 650;
function biomeIndexAt(x){ return Math.floor(x/SEG); }
function biomeAt(x){ const i=biomeIndexAt(x); return BIOMES[((i%BIOMES.length)+BIOMES.length)%BIOMES.length]; }
function paletteAt(x){
  const i = biomeIndexAt(x);
  const cur = BIOMES[((i%BIOMES.length)+BIOMES.length)%BIOMES.length];
  const nxt = BIOMES[(((i+1)%BIOMES.length)+BIOMES.length)%BIOMES.length];
  const into = x - i*SEG;
  const t0 = clamp((into-(SEG-BLEND))/BLEND, 0, 1);
  if(t0<=0) return cur;
  const t = t0*t0*(3-2*t0), o={ name:cur.name, sub:cur.sub };
  for(const k of ["gA","gB","tree","treeD","water","sand"]) o[k]=lerpColor(cur[k],nxt[k],t);
  o.coast = lerp(cur.coast, nxt.coast, t); o.night = lerp(cur.night, nxt.night, t);
  return o;
}

/* ---------- world geometry (아이소메트릭) ---------- */
const ISO_X = 0.92, ISO_Y = 0.46;
function meander(x){
  return Math.sin(x*0.0013)*210 + Math.sin(x*0.0031+1.3)*120 + Math.sin(x*0.00037+0.6)*240;
}
function dMeander(x){ return (meander(x+3)-meander(x-3))/6; }
function hill(x,y){
  return Math.sin(x*0.0011 + y*0.0006)*15 + Math.sin(y*0.0019 + x*0.0003)*9 + Math.sin((x+y)*0.00045)*11;
}
function trackZ(x){ return hill(x, meander(x)); }

let camPX=0, camPY=0;
function proj(x,y,z){
  return [ (x-y)*ISO_X - camPX, (x+y)*ISO_Y - (z||0) - camPY ];
}

/* ---------- journey state ---------- */
let playing = true, speedMul = 1, worldX = 0, elapsed = 0, lastBiomeIdx = -1;
const BASE_SPEED = 60;
const smoke = [];
let smokePos = null;

const regionEl = document.getElementById('region');
const clockEl = document.getElementById('clock');
let regionTimer = null;
function announce(b){
  regionEl.innerHTML = `${b.name}<small>${b.sub}</small>`;
  regionEl.style.opacity = 1;
  clearTimeout(regionTimer);
  regionTimer = setTimeout(()=>{ regionEl.style.opacity = 0; }, 3400);
}

/* ---------- ground tiles ---------- */
const TILE = 72;
function drawGround(){
  const cx = worldX, cy = meander(worldX), R = 980;
  const tiles = [];
  const gi0 = Math.floor((cx-R)/TILE), gi1 = Math.floor((cx+R)/TILE);
  const gj0 = Math.floor((cy-R)/TILE), gj1 = Math.floor((cy+R)/TILE);
  for(let gi=gi0; gi<=gi1; gi++) for(let gj=gj0; gj<=gj1; gj++){
    const x = gi*TILE+TILE/2, y = gj*TILE+TILE/2;
    const p = proj(x,y,hill(x,y));
    if(p[0]<-110 || p[0]>W+110 || p[1]<-110 || p[1]>H+110) continue;
    tiles.push([x+y, gi, gj, x, y]);
  }
  tiles.sort((a,b)=>a[0]-b[0]);
  for(const [,gi,gj,x,y] of tiles){
    const pal = paletteAt(x);
    const h = hash(gi*57.3 + gj*131.7);
    let col = h<0.5 ? pal.gA : pal.gB;
    const d = y - meander(x); // 선로에서 남쪽(+)으로 얼마나 떨어졌나
    if(pal.coast > 0.55){
      if(d > 200) col = pal.water;
      else if(d > 120) col = pal.sand;
    }
    const z = hill(x,y), e = 1.07, s = TILE/2*e;
    const c1 = proj(x-s, y-s, z), c2 = proj(x+s, y-s, z), c3 = proj(x+s, y+s, z), c4 = proj(x-s, y+s, z);
    poly([c1,c2,c3,c4], col);
    if(h > 0.93){ // 잔디 결 같은 미세한 점
      const c = proj(x,y,z);
      ctx.fillStyle = "rgba(0,0,0,.06)";
      ctx.fillRect(c[0]-2, c[1]-1, 4, 2);
    }
  }
}

/* ---------- decorations ---------- */
function drawTreeAt(sx, sy, s, pal, kind, r){
  ctx.save(); ctx.translate(sx, sy);
  if(kind==='cactus'){
    ctx.fillStyle = pal.tree;
    ctx.fillRect(-3*s, -26*s, 6*s, 26*s);
    ctx.fillRect(-10*s, -19*s, 4.5*s, 10*s); ctx.fillRect(-10*s, -19*s, 8*s, 4*s);
    ctx.fillRect(6*s, -22*s, 4.5*s, 13*s); ctx.fillRect(2*s, -22*s, 8*s, 4*s);
  } else if(kind==='palm'){
    ctx.strokeStyle = "#6b543a"; ctx.lineWidth = 3.4*s; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(3*s,-14*s, 6*s,-24*s); ctx.stroke();
    ctx.strokeStyle = pal.tree; ctx.lineWidth = 3*s;
    for(let a=0;a<5;a++){
      const ang = -Math.PI*0.9 + a*0.45;
      ctx.beginPath(); ctx.moveTo(6*s,-24*s);
      ctx.quadraticCurveTo(6*s+Math.cos(ang)*13*s, -24*s+Math.sin(ang)*10*s-5*s, 6*s+Math.cos(ang)*21*s, -24*s+Math.sin(ang)*15*s+4*s);
      ctx.stroke();
    }
  } else if(kind==='pine'){
    ctx.fillStyle = "#5b4632"; ctx.fillRect(-1.8*s,-8*s,3.6*s,8*s);
    for(let i=0;i<3;i++){
      const w=(19-i*4.4)*s, yy=-6*s-i*9.5*s;
      poly([[-w/2+0, yy], [w/2, yy], [0, yy-14*s]], i===2?pal.tree:pal.treeD);
      ctx.save(); ctx.translate(0,0); ctx.restore();
      ctx.fillStyle = i===2 ? pal.tree : pal.treeD;
      ctx.beginPath(); ctx.moveTo(-w/2, yy); ctx.lineTo(w/2, yy); ctx.lineTo(0, yy-14*s); ctx.closePath(); ctx.fill();
    }
  } else {
    ctx.fillStyle = "#5b4632"; ctx.fillRect(-2*s,-11*s,4*s,11*s);
    ctx.fillStyle = pal.treeD; ctx.beginPath(); ctx.arc(2*s,-19*s,10.5*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = pal.tree;  ctx.beginPath(); ctx.arc(-2*s,-23*s,10*s,0,Math.PI*2); ctx.arc(-9*s,-16*s,7.5*s,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawHouseAt(sx, sy, s, pal){
  const ex = [ISO_X, ISO_Y], ey = [-ISO_X, ISO_Y];
  const w = 30*s, d = 26*s, hgt = 19*s;
  const B = [sx,sy];
  const X = [B[0]+ex[0]*w, B[1]+ex[1]*w];
  const Y = [B[0]+ey[0]*d, B[1]+ey[1]*d];
  const XY = [B[0]+ex[0]*w+ey[0]*d, B[1]+ex[1]*w+ey[1]*d];
  const up = p=>[p[0], p[1]-hgt];
  poly([Y, XY, up(XY), up(Y)], "#6e4a35");              // 왼쪽 면
  poly([X, XY, up(XY), up(X)], "#7d563f");              // 오른쪽 면
  poly([up(B), up(X), up(XY), up(Y)], "#a33f2e");       // 지붕
  if(pal.night > 0.4){
    ctx.fillStyle = "#ffd97a";
    ctx.fillRect(sx-3*s, sy-11*s, 4.4*s, 5*s);
    ctx.fillRect(sx+8*s, sy-8*s, 4.4*s, 5*s);
  } else {
    ctx.fillStyle = "rgba(230,245,255,.85)";
    ctx.fillRect(sx-3*s, sy-11*s, 4.4*s, 5*s);
  }
}
function collectDecor(){
  const back=[], front=[];
  const cell=150, cx=worldX, cy=meander(worldX), R=950;
  const i0=Math.floor((cx-R)/cell), i1=Math.floor((cx+R)/cell);
  const j0=Math.floor((cy-R)/cell), j1=Math.floor((cy+R)/cell);
  for(let i=i0;i<=i1;i++) for(let j=j0;j<=j1;j++){
    const r = hash(i*91.7 + j*47.3);
    const ox = i*cell + hash(i*3.1+j)*70, oy = j*cell + hash(j*5.7+i)*70;
    const dist = oy - meander(ox);
    if(Math.abs(dist) < 58 || Math.abs(dist) > 640) continue;
    const name = biomeAt(ox).sub;
    let density = 0.42;
    if(name==='FOREST') density=0.78; else if(name==='DESERT') density=0.2;
    else if(name==='COAST') density=0.26; else if(name==='NIGHT') density=0.5;
    if(r > density) continue;
    const p = proj(ox, oy, hill(ox,oy));
    if(p[0]<-70 || p[0]>W+70 || p[1]<-80 || p[1]>H+70) continue;
    const tr = hash(i*31.7 + j*17.9); // 종류 선택은 밀도 판정과 별개 값으로 (같은 값 쓰면 집·야자수 등이 영영 안 나옴)
    const item = { x:p[0], y:p[1], s:0.85+hash(i*7+j*13)*0.5, pal:paletteAt(ox), name, r:tr, depth:ox+oy };
    (dist<0?back:front).push(item);
  }
  back.sort((a,b)=>a.depth-b.depth); front.sort((a,b)=>a.depth-b.depth);
  return {back, front};
}
function drawDecorItem(it){
  const {x,y,s,pal,name,r} = it;
  if(name==='DESERT'){ if(r>0.45) drawTreeAt(x,y,s,pal,'cactus',r);
    else { ctx.fillStyle="rgba(120,90,50,.55)"; ctx.beginPath(); ctx.ellipse(x,y-3*s,11*s,4.5*s,0,0,Math.PI*2); ctx.fill(); } }
  else if(name==='COAST'){ drawTreeAt(x,y,s,pal, r>0.55?'palm':'round', r); }
  else if(name==='FOREST'){ drawTreeAt(x,y,s*1.2,pal,'pine',r); }
  else if(name==='SNOW'){ drawTreeAt(x,y,s*1.05,pal,'pine',r);
    ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath(); ctx.arc(x,y-34*s,4.4*s,0,Math.PI*2); ctx.fill(); }
  else if(name==='NIGHT'){
    if(r>0.62) drawHouseAt(x,y,s,pal);
    else if(r>0.5){ // 가로등
      ctx.strokeStyle="#0d1521"; ctx.lineWidth=2.4*s;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-24*s); ctx.stroke();
      ctx.save(); ctx.fillStyle="#ffd97a"; ctx.shadowColor="#ffd97a"; ctx.shadowBlur=13;
      ctx.beginPath(); ctx.arc(x,y-26*s,3*s,0,Math.PI*2); ctx.fill(); ctx.restore();
    } else drawTreeAt(x,y,s*1.1,pal,'pine',r);
  }
  else { // MEADOW
    if(r>0.8) drawHouseAt(x,y,s,pal); else drawTreeAt(x,y,s,pal,'round',r);
  }
}

/* ---------- track ---------- */
function trackPoints(){
  const pts=[];
  for(let x=worldX-1350; x<=worldX+1550; x+=14){
    const m = dMeander(x), inv = 1/Math.sqrt(1+m*m);
    const px = -m*inv, py = inv; // 진행 방향에 수직인 월드 벡터
    pts.push({x, y:meander(x), z:trackZ(x)+3, px, py});
  }
  return pts;
}
function drawTrack(){
  const pts = trackPoints();
  // 노반
  const left = pts.map(p=>proj(p.x+p.px*17, p.y+p.py*17, p.z));
  const right = pts.map(p=>proj(p.x-p.px*17, p.y-p.py*17, p.z)).reverse();
  poly(left.concat(right), "#6f6459");
  // 침목
  ctx.strokeStyle = "#4c3a28"; ctx.lineWidth = 4.4;
  for(let i=0;i<pts.length;i+=2){
    const p=pts[i];
    const a=proj(p.x+p.px*14, p.y+p.py*14, p.z+0.6), b=proj(p.x-p.px*14, p.y-p.py*14, p.z+0.6);
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
  // 레일 2줄
  for(const off of [7,-7]){
    ctx.strokeStyle = "#d7dde5"; ctx.lineWidth = 2.4; ctx.beginPath();
    pts.forEach((p,i)=>{ const s=proj(p.x+p.px*off, p.y+p.py*off, p.z+1.4); i===0?ctx.moveTo(s[0],s[1]):ctx.lineTo(s[0],s[1]); });
    ctx.stroke();
  }
  // 신호기 (가끔)
  for(let gx=Math.floor((worldX-1200)/560)*560; gx<worldX+1500; gx+=560){
    const y = meander(gx), m=dMeander(gx), inv=1/Math.sqrt(1+m*m);
    const ox = gx + (-m*inv)*-26, oy = y + inv*-26;
    const p = proj(ox, oy, hill(ox,oy));
    if(p[0]<-20||p[0]>W+20) continue;
    ctx.strokeStyle="#22282e"; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0],p[1]-21); ctx.stroke();
    ctx.fillStyle="#39e07a"; ctx.beginPath(); ctx.arc(p[0],p[1]-24,3,0,Math.PI*2); ctx.fill();
  }
}

/* ---------- train (6량, 아이소 박스) ---------- */
const CAR_COLORS = ["#31556e","#7a4b3a","#4a6741","#6b5b8f","#8a6d3b","#546e7a"];
function carPositions(){
  const pos=[worldX];
  let x=worldX;
  for(let i=1;i<6;i++){ const m=dMeander(x); x -= 122/Math.sqrt(1+m*m); pos.push(x); }
  return pos;
}
function drawCar(x, idx){
  const y = meander(x), z = trackZ(x)+4;
  const m = dMeander(x), inv = 1/Math.sqrt(1+m*m);
  const tx = inv, ty = m*inv;                       // 월드 진행 단위벡터
  const vx = (tx-ty)*ISO_X, vy = (tx+ty)*ISO_Y;     // 화면 진행 벡터 (단위 길이당)
  const vlen = Math.hypot(vx,vy);
  const ux = vx/vlen, uy = vy/vlen, px = -uy, py = ux;
  const c = proj(x,y,z);
  const L = 102*vlen, Wd = 30, Hgt = 27;
  const sideSign = py>0?1:-1;
  const A = [c[0]-ux*L/2, c[1]-uy*L/2], B = [c[0]+ux*L/2, c[1]+uy*L/2];
  const off = [px*sideSign*Wd/2, py*sideSign*Wd/2];
  const A2=[A[0]+off[0],A[1]+off[1]], B2=[B[0]+off[0],B[1]+off[1]];
  const up = p=>[p[0],p[1]-Hgt];
  const base = CAR_COLORS[idx];
  // 바퀴 그림자
  ctx.fillStyle="rgba(0,0,0,.28)";
  ctx.beginPath(); ctx.ellipse(c[0], c[1]+3, L*0.52, 6, Math.atan2(uy,ux), 0, Math.PI*2); ctx.fill();
  // 끝면 (뒤쪽 칸 연결부 반대편)
  const endAtFront = uy>0;
  const E1 = endAtFront? B2:A2;
  const F1 = endAtFront? [B[0]-off[0], B[1]-off[1]] : [A[0]-off[0], A[1]-off[1]];
  poly([E1, F1, up(F1), up(E1)], shade(base, 0.72));
  // 옆면
  poly([A2, B2, up(B2), up(A2)], shade(base, 0.92));
  // 지붕(윗면)
  const ATopIn = [A[0]-off[0], A[1]-off[1]], BTopIn = [B[0]-off[0], B[1]-off[1]];
  poly([up(A2), up(B2), up(BTopIn), up(ATopIn)], shade(base, 1.22));
  // 창문
  const night = paletteAt(x).night;
  ctx.fillStyle = night>0.4 ? "#ffd97a" : "#ffefc4";
  const n = idx===0?2:4;
  for(let i=0;i<n;i++){
    const t = -0.36 + i*(0.72/Math.max(n-1,1)) || 0;
    const cxp = c[0]+ux*L*t + off[0], cyp = c[1]+uy*L*t + off[1] - Hgt + 8;
    const wHalf = [ux*7, uy*7];
    poly([[cxp-wHalf[0], cyp-wHalf[1]], [cxp+wHalf[0], cyp+wHalf[1]], [cxp+wHalf[0], cyp+wHalf[1]+9], [cxp-wHalf[0], cyp-wHalf[1]+9]], ctx.fillStyle);
  }
  if(idx===0){
    // 운전실 + 굴뚝 + 전조등
    const fx = B[0]-ux*14+off[0], fy = B[1]-uy*14+off[1];
    ctx.fillStyle = shade(base, 0.8); ctx.fillRect(fx-8, fy-Hgt-11, 17, 12);
    ctx.fillStyle = "#20262c"; ctx.fillRect(fx+2, fy-Hgt-21, 6.5, 11);
    ctx.save(); ctx.fillStyle="#ffe27a"; ctx.shadowColor="#ffe27a"; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.arc(B2[0]+ux*2, B2[1]-10, 3.2, 0, Math.PI*2); ctx.fill(); ctx.restore();
    smokePos = [fx+5, fy-Hgt-24];
  }
}
function drawTrain(){
  const pos = carPositions();
  for(let idx=5; idx>=0; idx--) drawCar(pos[idx], idx);
  if(playing && smokePos && Math.random()<0.4) smoke.push({x:smokePos[0], y:smokePos[1], r:4.5, life:1});
  for(let i=smoke.length-1;i>=0;i--){
    const p=smoke[i]; p.x-=0.3; p.y-=0.6; p.r+=0.22; p.life-=0.012;
    if(p.life<=0){ smoke.splice(i,1); continue; }
    ctx.fillStyle=`rgba(255,255,255,${0.32*p.life})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
}

/* ---------- audio: 잔잔한 패드 (선택) ---------- */
let audioCtx=null, audioOn=false, padTimer=null;
function toggleAudio(){
  if(audioOn){
    audioOn=false; clearInterval(padTimer); if(audioCtx) audioCtx.close(); audioCtx=null;
    document.getElementById('soundBtn').textContent="소리 켜기"; return;
  }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const chords = [[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];
  let ci=0;
  const playChord=()=>{
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    chords[ci%chords.length].forEach(f=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+1.6);
      g.gain.linearRampToValueAtTime(0.0001,t+7.8);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+8);
    });
    ci++;
  };
  playChord(); padTimer=setInterval(playChord, 7000);
  audioOn=true; document.getElementById('soundBtn').textContent="소리 끄기";
}

/* ---------- controls ---------- */
document.getElementById('playBtn').addEventListener('click', e=>{
  playing=!playing; e.target.textContent = playing?"멈추기":"계속 가기";
});
const speeds=[1,0.5,1.6]; let speedIdx=0;
document.getElementById('speedBtn').addEventListener('click', e=>{
  speedIdx=(speedIdx+1)%speeds.length; speedMul=speeds[speedIdx];
  e.target.textContent = "속도 "+speedMul+"배";
});
document.getElementById('soundBtn').addEventListener('click', toggleAudio);
if(navigator.wakeLock){ navigator.wakeLock.request('screen').catch(()=>{}); }

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  if(playing){ worldX += BASE_SPEED*speedMul*dt; elapsed += dt; }

  // 카메라: 기관차가 화면의 42% / 46% 지점에 오도록
  const hx = worldX, hy = meander(worldX), hz = trackZ(worldX);
  camPX = (hx-hy)*ISO_X - W*0.42;
  camPY = (hx+hy)*ISO_Y - hz - H*0.46;

  ctx.fillStyle = "#20301f"; ctx.fillRect(0,0,W,H);
  drawGround();
  const decor = collectDecor();
  decor.back.forEach(drawDecorItem);
  drawTrack();
  drawTrain();
  decor.front.forEach(drawDecorItem);

  const bi = biomeIndexAt(worldX);
  if(bi!==lastBiomeIdx){ lastBiomeIdx=bi; announce(biomeAt(worldX)); }
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(Math.floor(elapsed%60)).padStart(2,'0');
  clockEl.textContent = `${mm}:${ss}`;
  requestAnimationFrame(frame);
}
announce(BIOMES[0]);
requestAnimationFrame(frame);
</script>
