  *{margin:0;padding:0;box-sizing:border-box}

  canvas{display:block}

    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.65);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap;z-index:5}

    max-width:97vw;overflow-x:auto;scrollbar-width:none}

<script>
"use strict";
const errBox = document.getElementById('err');
window.addEventListener('error', e=>{
  errBox.style.display='block';
  errBox.textContent = '오류가 생겼어요: ' + (e.message || e.type);
});
if(typeof THREE === 'undefined'){
  errBox.style.display='block'; errBox.textContent='3D 라이브러리를 불러오지 못했어요.';
  throw new Error('THREE missing');
}

/* ================= helpers ================= */
function hash(n){ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(t){ return t*t*(3-2*t); }
let _seed = 123456789;
function srand(seed){ _seed = seed>>>0 || 1; }
function rnd(){ _seed = (_seed*16807)%2147483647; return (_seed-1)/2147483646; }

/* ================= biome palettes ================= */
const SEG3 = 820, BLEND3 = 230;
const PALS = [
  { name:"아침 초원", sub:"MEADOW", sky:0xa9cfee, gA:0x79b657, gB:0x639e47, far:0x8fb98a, sun:0xfff2d8, sunI:1.2, hemiI:0.75, night:0, coast:0, alpine:0, snow:0 },
  { name:"깊은 숲",   sub:"FOREST", sky:0x9ec9b4, gA:0x4f8a45, gB:0x3d7038, far:0x5d8a66, sun:0xf2ffd8, sunI:1.05, hemiI:0.65, night:0, coast:0, alpine:0, snow:0, mount:0 },
  { name:"해변",    sub:"COAST",  sky:0xa5dcf2, gA:0xdcc79e, gB:0xcdb488, far:0x7fb2c9, sun:0xfff6d8, sunI:1.25, hemiI:0.8, night:0, coast:1, alpine:0, snow:0 },
  { name:"노을 사막", sub:"DESERT", sky:0xf2c48d, gA:0xddba68, gB:0xcaa050, far:0xc98d5a, sun:0xffd9a0, sunI:1.3, hemiI:0.7, night:0.15, coast:0, alpine:0, snow:0, mount:0, desert:1 },
  { name:"노을 호수", sub:"SUNSET", sky:0xfb9a4e, gA:0x9aa04e, gB:0x7f9448, far:0xc97a4a, sun:0xffb066, sunI:1.25, hemiI:0.55, night:0.25, coast:0, alpine:0, snow:0 },
  { name:"눈 내리는 마을", sub:"SNOW", sky:0xcfdde8, gA:0xf0f5f9, gB:0xdfe9f1, far:0xb9cbd8, sun:0xeef4ff, sunI:1.0, hemiI:0.8, night:0, coast:0, alpine:0, snow:0.8 },
  { name:"설산", sub:"ALPINE", sky:0xd7e6f2, gA:0xeef3f7, gB:0xd3dee8, far:0xa9bfd2, sun:0xf4f8ff, sunI:1.15, hemiI:0.85, night:0, coast:0, alpine:1, snow:1 },
  { name:"밤하늘 아래", sub:"NIGHT", sky:0x0d1626, gA:0x274434, gB:0x1f382a, far:0x1c2b3a, sun:0x93b8ff, sunI:0.22, hemiI:0.22, night:1, coast:0, alpine:0, snow:0 },
];
const _ca = new THREE.Color(), _cb = new THREE.Color();
function lerpCol(out, a, b, t){ _ca.setHex(a); _cb.setHex(b); out.copy(_ca).lerp(_cb, t); return out; }
function biomeIndexAt3(s){ return Math.floor(s/SEG3); }
function biomeAt3(s){ const i=biomeIndexAt3(s); return PALS[((i%PALS.length)+PALS.length)%PALS.length]; }
function paletteAt3(s){
  const i = biomeIndexAt3(s);
  const cur = PALS[((i%PALS.length)+PALS.length)%PALS.length];
  const nxt = PALS[(((i+1)%PALS.length)+PALS.length)%PALS.length];
  const into = s - i*SEG3;
  const t = smooth(clamp((into-(SEG3-BLEND3))/BLEND3, 0, 1));
  const o = { name:cur.name, sub:cur.sub, sky:new THREE.Color(), gA:new THREE.Color(), gB:new THREE.Color(), far:new THREE.Color(), sun:new THREE.Color(),
    sunI:lerp(cur.sunI,nxt.sunI,t), hemiI:lerp(cur.hemiI,nxt.hemiI,t), night:lerp(cur.night,nxt.night,t), coast:lerp(cur.coast,nxt.coast,t),
    alpine:lerp(cur.alpine,nxt.alpine,t), snow:lerp(cur.snow,nxt.snow,t), mount:lerp(cur.mount||0,nxt.mount||0,t), desert:lerp(cur.desert||0,nxt.desert||0,t) };
  lerpCol(o.sky, cur.sky, nxt.sky, t); lerpCol(o.gA, cur.gA, nxt.gA, t);
  lerpCol(o.gB, cur.gB, nxt.gB, t); lerpCol(o.far, cur.far, nxt.far, t); lerpCol(o.sun, cur.sun, nxt.sun, t);
  return o;
}

/* ================= world path ================= */
const ALP_W = PALS.map(p=>p.alpine||0), MNT_W = PALS.map(p=>p.mount||0);
function biomeW(s, arr){
  const i = Math.floor(s/SEG3), n = arr.length;
  const cur = arr[((i%n)+n)%n], nxt = arr[(((i+1)%n)+n)%n];
  const into = s - i*SEG3;
  const t = smooth(clamp((into-(SEG3-BLEND3))/BLEND3, 0, 1));
  return lerp(cur, nxt, t);
}
function alpineW(s){ return biomeW(s, ALP_W); }
function mountW(s){ return biomeW(s, MNT_W); }
function latAt(s){ return Math.sin(s*0.004)*90 + Math.sin(s*0.0011+1.3)*140 + Math.sin(s*0.00023+0.5)*180; }
function elevAt(s){
  const base = Math.sin(s*0.0021+0.7)*4.5 + Math.sin(s*0.0006)*7 + Math.sin(s*0.0053)*1.6;
  const aw = alpineW(s), mw = mountW(s);
  return base
    + aw * (11 + Math.sin(s*0.0013+2.0)*5.5 + Math.sin(s*0.0042)*1.4)   // 설산은 높이
    + mw * (7 + Math.sin(s*0.0017+0.9)*3.2 + Math.sin(s*0.005)*1.0);     // 산은 중간 높이로 오른다
}
const _pv = new THREE.Vector3();
function pathPoint(s, out){ return (out||_pv).set(s, elevAt(s), latAt(s)); }
function groundH(x, z){
  const lz = latAt(x), e = elevAt(x);
  const palG = paletteAt3(x);
  const sd = z - lz, d = Math.abs(sd);
  const t = clamp((d-16)/90, 0, 1), tt = t*t;
  const rugged = 1 + palG.alpine*1.9 + palG.mount*1.25; // 산·설산은 지형이 험하게
  const roll = (Math.sin(x*0.011+z*0.017)*2.2 + Math.sin(x*0.004-z*0.006+2)*4.5 + Math.sin((x+z)*0.0016)*7) * tt * rugged;
  const dune = (Math.sin(x*0.006+z*0.0045)*3.2 + Math.sin((x-z)*0.0022+1)*5.5) * tt * 1.15; // 사막은 긴 파장의 모래언덕
  let h = e + lerp(roll, dune, palG.desert);
  const cf = palG.coast;
  if(cf > 0.03 && sd > 0){ // 바닷가 쪽은 해변처럼 낮아짐
    const sink = smooth(clamp((sd-16)/46, 0, 1));
    h = lerp(h, e - 2.6, cf * sink * (1 - tt*0.4));
  }
  const bz = bridgeZoneAt(x); // 교량 구간은 아래가 물이 되게 푹 꺼진다
  if(bz){
    const w = smooth(Math.min(clamp((x - bz[0])/7, 0, 1), clamp((bz[1] - x)/7, 0, 1)));
    if(w > 0) h = lerp(h, Math.min(h, e - 8), w);
  }
  return h;
}
function bridgeZoneAt(x){
  const ci = Math.floor(x/CHUNK);
  if(biomeAt3(ci*CHUNK + CHUNK/2).sub !== 'COAST') return null;
  if(hash(ci*13.73) >= 0.5) return null;
  return [ci*CHUNK + 55, ci*CHUNK + 205];
}

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cfee);
scene.fog = new THREE.Fog(0xa9cfee, 130, 720);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { top: { value: new THREE.Color(0x8fc3e8) }, bot: { value: new THREE.Color(0xd8ecfa) } },
  vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.7+0.10, 0.0, 1.0); gl_FragColor = vec4(mix(bot, top, pow(h,0.75)), 1.0); }"
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1500, 24, 12), skyMat);
skyDome.frustumCulled = false;
scene.add(skyDome);
/* 실제 하늘 사진 (Poly Haven CC0 HDRI): 배경 + 환경 조명 */
const bgColor = new THREE.Color(0xa9cfee);
scene.background = bgColor;
const pmrem = new THREE.PMREMGenerator(renderer);
const skyTexs = {}, envCache = {};
let skyMode = 'gradient';
if(THREE.RGBELoader){
  const rgbe = new THREE.RGBELoader();
  for(const [key, file] of [['day', 'assets/sky_day.hdr'], ['sunset', 'assets/sky_sunset.hdr']]){
    rgbe.load(file, tex=>{
      tex.mapping = THREE.EquirectangularReflectionMapping;
      skyTexs[key] = tex;
    }, undefined, ()=>{});
  }
}
/* 사진 파노라마 배경 (생성 이미지): 바이옴별 배경 전체를 사진으로 */
const panoTexs = {};
const PANO_BG = { MEADOW: 0x9db9dc, FOREST: 0x9db9dc, DESERT: 0xf0b183, COAST: 0xa8d4ea };
const panoMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1700, 1700, 1500, 40, 1, true),
  new THREE.MeshBasicMaterial({ side: THREE.BackSide, fog: false, depthWrite: false })
);
panoMesh.visible = false; panoMesh.frustumCulled = false; panoMesh.renderOrder = -10;
scene.add(panoMesh);
for(const [psub, pfile] of [['MEADOW', 'assets/pano_rockies.jpg'], ['FOREST', 'assets/pano_rockies.jpg'], ['DESERT', 'assets/pano_desert.jpg'], ['COAST', 'assets/pano_coast.jpg']]){
  new THREE.TextureLoader().load(pfile, t=>{
    t.encoding = THREE.sRGBEncoding;
    t.wrapS = THREE.MirroredRepeatWrapping; t.repeat.x = 2; t.anisotropy = 8;
    panoTexs[psub] = t;
  }, undefined, ()=>{});
}
/* 사진 지면 텍스처 (생성 이미지): 초원·숲의 가까운 지면을 사진 질감으로 */
const groundTexs = {};
for(const [gsub, gfile, grx, gry] of [['MEADOW', 'assets/ground_meadow.jpg', 10, 18], ['FOREST', 'assets/ground_forest.jpg', 8, 14], ['DESERT', 'assets/ground_desert.jpg', 8, 14], ['COAST', 'assets/ground_coast.jpg', 8, 14]]){
  new THREE.TextureLoader().load(gfile, t=>{
    t.encoding = THREE.sRGBEncoding;
    t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
    t.repeat.set(grx, gry); t.anisotropy = 8;
    groundTexs[gsub] = t;
  }, undefined, ()=>{});
}
/* 사진 소품 빌보드 (생성 사진에서 배경을 걷어낸 소나무): 초원·숲에서 3D 나무 대신 실사 나무 */
let bbTex = null, bbMat = null;
const bbGeom = new THREE.PlaneGeometry(0.98, 2); bbGeom.translate(0, 1, 0);
const BB_SET = new Map();
let houseTex = null, houseMat = null;
const houseGeom = new THREE.PlaneGeometry(2.98, 2); houseGeom.translate(0, 1, 0);
new THREE.TextureLoader().load('assets/prop_house.png', t=>{
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  houseMat = new THREE.MeshStandardMaterial({ map: t, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 1 });
  houseTex = t;
}, undefined, ()=>{});
/* 밭 사진 질감: 단색 밭 평면을 실제 작물 사진으로 */
new THREE.TextureLoader().load('assets/ground_field.jpg', t=>{
  t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.anisotropy = 8;
  const reps = [[2, 1.25], [3, 1.9], [1.5, 0.94]], tints = [0xffffff, 0xf2e8d5, 0xe2d8c2];
  fieldMats.forEach((m, i)=>{
    const tc = t.clone(); tc.needsUpdate = true; tc.repeat.set(reps[i][0], reps[i][1]); tc.offset.set(i*0.37, i*0.53);
    m.map = tc; m.color.set(tints[i]); m.needsUpdate = true;
  });
}, undefined, ()=>{});
new THREE.TextureLoader().load('assets/prop_pine.png', t=>{
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  bbMat = new THREE.MeshStandardMaterial({ map: t, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 1 });
  bbTex = t;
}, undefined, ()=>{});
let palmTex = null, palmMat = null;
new THREE.TextureLoader().load('assets/prop_palm.png', t=>{
  t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  palmMat = new THREE.MeshStandardMaterial({ map: t, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 1 });
  palmTex = t;
}, undefined, ()=>{});
const _skyTop = new THREE.Color(), _skyBot = new THREE.Color(), _white = new THREE.Color(0xffffff), _black = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2400);
camera.position.set(-30, 14, 60);

const hemi = new THREE.HemisphereLight(0xbfd9ea, 0x53684a, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -160; sun.shadow.camera.right = 160;
sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -160;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 800;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);

/* ================= canvas textures ================= */
function canvasTex(w, h, draw, repeat){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  if(repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = 4;
  return t;
}
const noiseTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle="#f4f4f4"; g.fillRect(0,0,w,h);
  srand(4242);
  for(let i=0;i<5200;i++){
    const v = 205 + Math.floor(rnd()*50);
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(rnd()*w, rnd()*h, 1+rnd()*2.2, 1+rnd()*2.2);
  }
}, true);
const gravelTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle="#6f675c"; g.fillRect(0,0,w,h);
  srand(777);
  for(let i=0;i<2400;i++){
    const v = 78 + Math.floor(rnd()*70);
    g.fillStyle = `rgb(${v+14},${v+6},${v-6})`;
    g.beginPath(); g.ellipse(rnd()*w, rnd()*h, 1+rnd()*2.6, 1+rnd()*1.8, rnd()*3, 0, Math.PI*2); g.fill();
  }
}, true);
const smokeTex = canvasTex(128, 128, (g,w,h)=>{
  const gr = g.createRadialGradient(64,64,4, 64,64,60);
  gr.addColorStop(0, "rgba(255,255,255,.85)"); gr.addColorStop(0.55, "rgba(255,255,255,.38)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0,0,w,h);
});
const windowStripTex = canvasTex(1024, 64, (g,w,h)=>{
  g.clearRect(0,0,w,h);
  g.fillStyle="#ffffff";
  const n=9, ww=74, gap=(w - n*ww)/(n+1);
  for(let i=0;i<n;i++){
    const x = gap + i*(ww+gap);
    g.beginPath(); g.roundRect(x, 9, ww, 46, 7); g.fill();
  }
});
function carSideTexture(hex, isLoco){
  return canvasTex(1024, 256, (g,w,h)=>{
    const col = "#" + hex.toString(16).padStart(6,'0');
    const grad = g.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, col); grad.addColorStop(0.78, col); grad.addColorStop(1, "rgba(0,0,0,0.34)");

function colored(geom, hex){
  const g = geom.index ? geom.toNonIndexed() : geom;
  const n = g.attributes.position.count;
  const col = new THREE.Color(hex);
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=col.r; arr[i*3+1]=col.g; arr[i*3+2]=col.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}
function xform(geom, x,y,z, rx,ry,rz, sx,sy,sz){
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0, ry||0, rz||0));
  m.compose(new THREE.Vector3(x,y,z), q, new THREE.Vector3(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz));
  geom.applyMatrix4(m);
  return geom;
}
function mergeGeoms(list){
  let total=0; list.forEach(g=>total+=g.attributes.position.count);
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2), col=new Float32Array(total*3);
  let o=0, o2=0;
  for(const g of list){
    const p=g.attributes.position, n=g.attributes.normal, u=g.attributes.uv, c=g.attributes.color;
    pos.set(p.array, o*3); nor.set(n.array, o*3); col.set(c.array, o*3);
    if(u) uv.set(u.array, o2); 
    o += p.count; o2 += p.count*2;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  out.setAttribute('color', new THREE.BufferAttribute(col,3));
  return out;
}

function bakeModel(root, targetH){
  root.updateMatrixWorld(true);
  const parts = [];
  root.traverse(o=>{
    if(o.isMesh){
      let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
      g.applyMatrix4(o.matrixWorld);
      const cnt = g.attributes.position.count;
      const col = new Float32Array(cnt*3);
      const c = (o.material && o.material.color) ? o.material.color : { r:1, g:1, b:1 };
      for(let i=0;i<cnt;i++){ col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      parts.push(g);
    }
  });
  let total = 0; for(const g of parts) total += g.attributes.position.count;
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3), colA = new Float32Array(total*3);
  let off = 0;
  for(const g of parts){
    pos.set(g.attributes.position.array, off*3);
    nor.set(g.attributes.normal.array, off*3);
    colA.set(g.attributes.color.array, off*3);
    off += g.attributes.position.count;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colA, 3));
  geo.computeBoundingBox();
  const bb = geo.boundingBox, size = new THREE.Vector3(), ctr = new THREE.Vector3();
  bb.getSize(size); bb.getCenter(ctr);
  geo.translate(-ctr.x, -bb.min.y, -ctr.z);
  const s = targetH / Math.max(size.y, 0.001);
  geo.scale(s, s, s);
  geo.computeBoundingBox();
  return geo;
}

    if(pal.coast > 0.4 && dTrack > 13 && dTrack < 34) cc.lerp(new THREE.Color(0xe6d29a), pal.coast*0.85); // 모래사장
    const rkAmt = Math.max(pal.alpine, pal.mount*0.85);
    if(rkAmt > 0.3){ const rk = hash(Math.floor(wx/6)*7.3 + Math.floor(wz/6)*3.9); cc.lerp(rockTint, rkAmt * (0.2 + rk*0.5)); } // 산·설산 바위 질감
    const hh = pos.getY(i) - e0;
    if(hh > 13) cc.lerp(rockTint, clamp((hh-13)/36, 0, 0.5)); // 높은 곳은 어디서든 바위색
    colors[i*3]=cc.r; colors[i*3+1]=cc.g; colors[i*3+2]=cc.b;
  }
  tg.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, terrainMat);
  terrain.position.set(centerX, 0, latC);
  terrain.receiveShadow = true;
  group.add(terrain);

  // 노반 (자갈 리본)
  const steps = Math.floor(CHUNK/6.5);
  const bPos = [], bUv = [], bIdx = [];
  for(let i=0;i<=steps;i++){
    const s = ci*CHUNK + i*6.5;
    pathPoint(s, _tp);
    const ahead = pathPoint(s+2, _ta);
    const dx = ahead.x-_tp.x, dz = ahead.z-_tp.z, il = 1/Math.hypot(dx,dz);
    const px = -dz*il, pz = dx*il;
    const by = _tp.y + 0.07 - (bz && s > bz[0]-2 && s < bz[1]+2 ? 1.5 : 0); // 교량 구간 자갈은 다리 아래로 숨김
    bPos.push(_tp.x+px*3.6, by, _tp.z+pz*3.6, _tp.x-px*3.6, by, _tp.z-pz*3.6);
    bUv.push(0, s/6, 1, s/6);
    if(i<steps){ const a=i*2; bIdx.push(a, a+2, a+1, a+1, a+2, a+3); }
  }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bPos), 3));
  bg.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(bUv), 2));
  bg.setIndex(bIdx); bg.computeVertexNormals();
  const ballast = new THREE.Mesh(bg, ballastMat);
  ballast.receiveShadow = true; ballast.frustumCulled = false;
  group.add(ballast);

  // 침목 + 레일 (인스턴싱)
  const nS = Math.floor(CHUNK/2.3);
  const sleepers = new THREE.InstancedMesh(sleeperGeom, sleeperMat, nS);
  for(let i=0;i<nS;i++){
    const s = ci*CHUNK + i*2.3;
    pathPoint(s, _tp); pathPoint(s+2, _ta);
    _dummy.position.set(_tp.x, _tp.y+0.13, _tp.z);
    _dummy.lookAt(_ta.x, _ta.y+0.13, _ta.z);
    _dummy.updateMatrix();
    sleepers.setMatrixAt(i, _dummy.matrix);
  }
  sleepers.frustumCulled = false; sleepers.receiveShadow = true;
  group.add(sleepers);
  const nR = Math.floor(CHUNK/6.5);
  const rails = new THREE.InstancedMesh(railGeom, railMat, nR*2);
  for(let i=0;i<nR;i++){
    const s = ci*CHUNK + i*6.5;
    pathPoint(s, _tp); pathPoint(s+2, _ta);
    const dx=_ta.x-_tp.x, dz=_ta.z-_tp.z, il=1/Math.hypot(dx,dz);
    const px=-dz*il, pz=dx*il;
    for(let k=0;k<2;k++){
      const off = k===0? 0.75 : -0.75;
      _dummy.position.set(_tp.x+px*off, _tp.y+0.28, _tp.z+pz*off);
      _dummy.lookAt(_ta.x+px*off, _ta.y+0.28, _ta.z+pz*off);
      _dummy.updateMatrix();
      rails.setMatrixAt(i*2+k, _dummy.matrix);
    }
  }
  rails.frustumCulled = false;
  group.add(rails);

  // 전신주 (선로를 따라)
  const nP = Math.floor(CHUNK/46);
  const poles = new THREE.InstancedMesh(poleGeomInst, foliageMat, nP);
  for(let i=0;i<nP;i++){
    const s = ci*CHUNK + i*46 + 24;
    pathPoint(s, _tp); pathPoint(s+2, _ta);
    const dx=_ta.x-_tp.x, dz=_ta.z-_tp.z, il=1/Math.hypot(dx,dz);
    const px=-dz*il, pz=dx*il;
    if(bz && s > bz[0]-4 && s < bz[1]+4){ // 교량 위에는 전신주 없음
      _dummy.position.set(0, -999, 0); _dummy.rotation.set(0,0,0); _dummy.scale.set(0.001, 0.001, 0.001);
    } else {
      _dummy.position.set(_tp.x - px*9.5, _tp.y - 0.1, _tp.z - pz*9.5);
      _dummy.lookAt(_ta.x - px*9.5, _ta.y - 0.1, _ta.z - pz*9.5);
      _dummy.rotation.x = 0; _dummy.rotation.z = 0;
    }
    _dummy.updateMatrix();
    poles.setMatrixAt(i, _dummy.matrix);
  }
  _dummy.rotation.set(0,0,0); _dummy.scale.set(1,1,1);
  poles.castShadow = true; poles.frustumCulled = false;
  group.add(poles);

  // 나무/바위 (인스턴싱)
  const plan = { pine:0, pineSnow:0, round:0, palm:0, cactus:0, rock:0, bush:0, bale:0, snowman:0 };
  if(bName==='MEADOW'){ plan.round=40; plan.pine=12; plan.rock=3; plan.bush=18; plan.bale=5; }
  else if(bName==='FOREST'){ plan.pine=112; plan.round=14; plan.rock=3; plan.bush=20; }
  else if(bName==='COAST'){ plan.palm=26; plan.round=7; plan.rock=2; plan.bush=6; }
  else if(bName==='DESERT'){ plan.cactus=24; plan.rock=12; }
  else if(bName==='SUNSET'){ plan.round=26; plan.pine=6; plan.bush=10; plan.bale=4; plan.rock=2; }
  else if(bName==='SNOW'){ plan.pineSnow=48; plan.rock=2; plan.snowman=3; }
  else if(bName==='ALPINE'){ plan.pineSnow=26; plan.rock=24; }
  else if(bName==='NIGHT'){ plan.pine=36; plan.round=6; }
  if(bbTex && (bName==='MEADOW' || bName==='FOREST')){ plan.pine = 0; plan.round = 0; }
  if(palmTex && bName==='COAST'){ plan.palm = 0; }
  for(const type of Object.keys(plan)){
    const cnt = plan[type];
    if(!cnt) continue;
    const mk = modelsSettled && MODEL_FOR[type] && MODELS[MODEL_FOR[type]];
    const inst = new THREE.InstancedMesh(mk? MODELS[mk] : GEOMS[type], mk? modelMat : foliageMat, cnt);
    let placed = 0, guard = 0, lastX = null, lastZ = 0;
    while(placed < cnt && guard++ < cnt*30){
      let x, z;
      if(lastX !== null && rnd() < 0.45){ // 뭉쳐서 자라는 느낌으로
        x = lastX + (rnd()-0.5)*18; z = lastZ + (rnd()-0.5)*18;
        if(Math.abs(z - latAt(x)) < 13) continue;
      } else { // 가까운 쪽에 더 많이
        x = ci*CHUNK + rnd()*CHUNK;
        const side = rnd()<0.5? -1: 1;
        const dist = 13 + Math.pow(rnd(), 1.5)*168;
        z = latAt(x) + side*dist;
      }
      const sideS = Math.sign(z - latAt(x)) || 1;
      const distS = Math.abs(z - latAt(x));
      if(bName==='COAST' && sideS>0 && distS>26 && type!=='rock') continue;   // 바다 쪽엔 나무 없음
      if(bName==='COAST' && sideS>0 && type==='palm' && distS>30) continue;
      if(bz && x > bz[0]-6 && x < bz[1]+6 && distS > 10) continue;   // 교량 구간 물 위엔 안 심음
      const sc = (0.8 + rnd()*0.75) * (bName==='FOREST'? 1.18 : 1);
      _dummy.position.set(x, groundH(x,z)-0.08, z);
      _dummy.rotation.set(0, rnd()*Math.PI*2, 0);
      _dummy.scale.set(sc, sc*(0.9+rnd()*0.25), sc);
      _dummy.updateMatrix();
      inst.setMatrixAt(placed++, _dummy.matrix);
      lastX = x; lastZ = z;
    }
    inst.count = placed;
    inst.castShadow = true; inst.frustumCulled = false;
    group.add(inst);
  }
  _dummy.rotation.set(0,0,0); _dummy.scale.set(1,1,1);

  // 사진 나무 빌보드 배치 (초원·숲): 매 프레임 카메라 쪽으로 돌아섬
  if(bbTex && (bName==='MEADOW' || bName==='FOREST')){
    const nBB = bName==='FOREST' ? 26 : 14;
    const bb = new THREE.InstancedMesh(bbGeom, bbMat, nBB);
    const items = [];
    let placed = 0, guard = 0;
    while(placed < nBB && guard++ < nBB*30){
      const x = ci*CHUNK + rnd()*CHUNK;
      const side = rnd()<0.5? -1: 1;
      const dist = placed % 3 === 0 ? 13 + rnd()*13 : 26 + Math.pow(rnd(), 1.4)*110;
      const z = latAt(x) + side*dist;
      items.push({ x, y: groundH(x, z) - 0.1, z, h: (7.5 + rnd()*4.5) * (bName==='FOREST'? 1.15 : 1) });
      placed++;
    }
    bb.count = placed; bb.frustumCulled = false;
    group.add(bb);
    const lst0 = BB_SET.get(ci) || []; lst0.push({ im: bb, items }); BB_SET.set(ci, lst0);
  }

  // 사진 야자수 빌보드 (해변): 육지 쪽 + 물가의 모래톱
  if(palmTex && bName==='COAST'){
    const nBB = 20;
    const pb = new THREE.InstancedMesh(bbGeom, palmMat, nBB);
    const items = [];
    let placed = 0, guard = 0;
    while(placed < nBB && guard++ < nBB*30){
      const x = ci*CHUNK + rnd()*CHUNK;
      if(bz && x > bz[0]-4 && x < bz[1]+4) continue;
      const sea = rnd() < 0.35;
      const side = sea ? 1 : -1;
      const dist = sea ? 15 + rnd()*15 : 14 + Math.pow(rnd(), 1.3)*80;
      const z = latAt(x) + side*dist;
      items.push({ x, y: groundH(x, z) - 0.1, z, h: 6.5 + rnd()*3.5, flip: rnd() < 0.5 });
      placed++;
    }
    pb.count = placed; pb.frustumCulled = false;
    group.add(pb);
    const lst2 = BB_SET.get(ci) || []; lst2.push({ im: pb, items }); BB_SET.set(ci, lst2);
  }

  // 집 (눈 마을·밤에는 마을처럼 모여서)
  const nH = bName==='MEADOW'?2 : bName==='SNOW'?9 : bName==='NIGHT'?5 : bName==='SUNSET'?2 : bName==='COAST'?1 : 0;
  const vX = ci*CHUNK + 60 + rnd()*140, vSide = rnd()<0.5? -1: 1;
  let skipHouses3D = false;
  if(houseTex && bName==='MEADOW' && nH > 0){
    skipHouses3D = true;
    const hb = new THREE.InstancedMesh(houseGeom, houseMat, nH);
    const items = [];
    for(let i=0;i<nH;i++){
      const hx = ci*CHUNK + 30 + rnd()*(CHUNK-60);
      const side = rnd()<0.5? -1: 1;
      const hz = latAt(hx) + side*(26 + rnd()*70);
      items.push({ x: hx, y: groundH(hx, hz) - 0.05, z: hz, h: 7 + rnd()*1.6, flip: rnd() < 0.5 });
    }
    hb.count = items.length; hb.frustumCulled = false;
    group.add(hb);
    const lst1 = BB_SET.get(ci) || []; lst1.push({ im: hb, items }); BB_SET.set(ci, lst1);
  }
  for(let i=0;i<(skipHouses3D? 0 : nH);i++){
    const clustered = bName==='SNOW' || bName==='NIGHT';
    const hx = clustered? vX + (i - (nH-1)/2)*12 + (rnd()-0.5)*5 : ci*CHUNK + 30 + rnd()*(CHUNK-60);
    if(bz && hx > bz[0]-8 && hx < bz[1]+8) continue; // 교량 구간엔 집 없음
    const side = clustered? vSide : (rnd()<0.5? -1: 1);
    const hz = latAt(hx) + side*(clustered? 23 + (i%2)*14 + rnd()*5 : 26 + rnd()*70);
    const hv = Math.floor(rnd()*2);
    const house = (modelsSettled && MODELS.house && MODELS.house2) ? buildModelHouse(hv) : buildHouse(hv);
    house.position.set(hx, groundH(hx,hz)-0.05, hz);
    house.rotation.y = (side<0? Math.PI : 0) + (rnd()-0.5)*0.7 + Math.PI/4*0;
    house.rotation.y += Math.atan2(-(latAt(hx+4)-latAt(hx-4)), 8)*0; // 선로 방향 대략 맞춤 (미세)
    group.add(house);
  }

  // 신호기 (가끔)
  if(hash(ci*3.17) < 0.6){
    const sx = ci*CHUNK + CHUNK*0.5;
    const sSide = (ci % 2 === 0)? 1 : -1;
    const sig = new THREE.Mesh(GEOMS.signal, foliageMat);
    sig.position.set(sx, elevAt(sx) - 0.05, latAt(sx) + sSide*6.4);
    sig.castShadow = true;
    group.add(sig);
  }

  // 초원·노을: 논밭
  if(bName==='MEADOW' || bName==='SUNSET'){
    const nF = 1 + Math.floor(rnd()*2);
    for(let i=0;i<nF;i++){
      const fx = ci*CHUNK + 40 + rnd()*(CHUNK-80);
      const fSide = rnd()<0.5? -1: 1;
      const fz = latAt(fx) + fSide*(36 + rnd()*26);
      const fg = new THREE.PlaneGeometry(48, 30, 6, 4); fg.rotateX(-Math.PI/2);
      const fp = fg.attributes.position;
      for(let v=0; v<fp.count; v++) fp.setY(v, groundH(fx + fp.getX(v), fz + fp.getZ(v)) + 0.07);
      fg.computeVertexNormals();
      const field = new THREE.Mesh(fg, fieldMats[Math.floor(rnd()*fieldMats.length)]);
      field.position.set(fx, 0, fz); field.receiveShadow = true;
      group.add(field);
    }
  }

  // 바닷가: 등대, 배, 파라솔
  if(bName==='COAST'){
    if(hash(ci*7.31) < 0.6){
      const lx = ci*CHUNK + 60 + rnd()*(CHUNK-120);
      const lz = latAt(lx) + 44 + rnd()*20;
      const lh = new THREE.Mesh(GEOMS.lighthouse, foliageMat);
      const lsc = 1.7 + rnd()*0.5;
      lh.scale.set(lsc, lsc, lsc);
      lh.position.set(lx, Math.max(groundH(lx,lz), elevAt(lx)-0.4) - 0.2, lz);
      lh.castShadow = true;
      group.add(lh);
    }
    const nB = 1 + Math.floor(rnd()*2);
    for(let i=0;i<nB;i++){
      const bx = ci*CHUNK + rnd()*CHUNK;
      const boat = new THREE.Mesh(GEOMS.boat, foliageMat);
      boat.position.set(bx, elevAt(bx)-0.3, latAt(bx) + 62 + rnd()*70);
      boat.rotation.y = rnd()*Math.PI*2;
      const bsc = 1.1 + rnd()*0.7; boat.scale.set(bsc, bsc, bsc);
      group.add(boat);
    }
    const nU = 2 + Math.floor(rnd()*3);
    for(let i=0;i<nU;i++){
      const ux = ci*CHUNK + rnd()*CHUNK;
      if(bz && ux > bz[0]-6 && ux < bz[1]+6) continue;
      const um = new THREE.Mesh(UMB_GEOMS[Math.floor(rnd()*3)], foliageMat);
      const uz = latAt(ux) + 19 + rnd()*8;
      um.position.set(ux, groundH(ux,uz), uz);
      um.rotation.y = rnd()*Math.PI;
      group.add(um);
    }
  }

  // 사막: 메사 (평평한 바위산)
  if(bName==='DESERT'){
    const nMs = 1 + Math.floor(rnd()*2);
    for(let i=0;i<nMs;i++){
      const mx2 = ci*CHUNK + rnd()*CHUNK;
      const mSide = rnd()<0.5? -1: 1;
      const mz2 = latAt(mx2) + mSide*(120 + rnd()*110);
      const mesa = new THREE.Mesh(new THREE.CylinderGeometry(13+rnd()*10, 19+rnd()*12, 15+rnd()*9, 7), mesaMat);
      mesa.position.set(mx2, groundH(mx2,mz2)+4, mz2);
      mesa.rotation.y = rnd()*Math.PI;
      mesa.castShadow = true;
      group.add(mesa);
    }
  }

  // 눈 마을·밤: 가로등
  if(bName==='SNOW' || bName==='NIGHT'){
    const nL = bName==='SNOW'? 5 : 3;
    for(let i=0;i<nL;i++){
      const lx = ci*CHUNK + 25 + i*(CHUNK-50)/nL + rnd()*10;
      const lSide = (i % 2 === 0)? 1 : -1;
      const lz = latAt(lx) + lSide*7.6;
      const pole = new THREE.Mesh(GEOMS.lamp, foliageMat);
      pole.position.set(lx, elevAt(lx)-0.05, lz);
      group.add(pole);
      const glow = new THREE.Mesh(lampGlowGeom, lampMat);
      glow.position.set(lx, elevAt(lx)+3.35, lz);
      group.add(glow);
    }
  }

  // 산·설산: 선로 옆 바위 절벽
  if(bName==='MOUNTAIN' || bName==='ALPINE'){
    const nC = 2 + Math.floor(rnd()*2);
    for(let i=0;i<nC;i++){
      const cx2 = ci*CHUNK + rnd()*CHUNK;
      const cSide = rnd()<0.5? -1: 1;
      const cz2 = latAt(cx2) + cSide*(20 + rnd()*22);
      const cliff = new THREE.Mesh(GEOMS.rock, foliageMat);
      const csc = 3.2 + rnd()*2.6;
      cliff.scale.set(csc, csc*0.85, csc);
      cliff.position.set(cx2, groundH(cx2,cz2)-0.3, cz2);
      cliff.rotation.y = rnd()*Math.PI*2;
      cliff.castShadow = true;
      group.add(cliff);
    }
  }

  // 설산: 얼음 호수
  if(bName==='ALPINE' && hash(ci*5.7) < 0.55){
    const kx = ci*CHUNK + 50 + rnd()*(CHUNK-100);
    const kSide = rnd()<0.5? -1: 1;
    const kz = latAt(kx) + kSide*(52 + rnd()*36);
    const kr = 15 + rnd()*11;
    const kg = new THREE.CircleGeometry(kr, 16); kg.rotateX(-Math.PI/2);
    const kp = kg.attributes.position;
    for(let v=0; v<kp.count; v++) kp.setY(v, groundH(kx + kp.getX(v), kz + kp.getZ(v)) + 0.12);
    kg.computeVertexNormals();
    const lake = new THREE.Mesh(kg, iceMat);
    lake.position.set(kx, 0, kz);
    group.add(lake);
  }

  // 노을: 호수
  if(bName==='SUNSET' && hash(ci*9.13) < 0.6){
    const kx = ci*CHUNK + 50 + rnd()*(CHUNK-100);
    const kSide = rnd()<0.5? -1: 1;
    const kz = latAt(kx) + kSide*(50 + rnd()*30);
    const kr = 17 + rnd()*10;
    const kg = new THREE.CircleGeometry(kr, 18); kg.rotateX(-Math.PI/2);
    const kp = kg.attributes.position;
    for(let v=0; v<kp.count; v++) kp.setY(v, groundH(kx + kp.getX(v)*1.5, kz + kp.getZ(v)) + 0.1);
    kg.computeVertexNormals();
    const lake = new THREE.Mesh(kg, waterMat);
    lake.scale.set(1.5, 1, 1);
    lake.position.set(kx, 0, kz);
    group.add(lake);
  }

  // 먼 산맥 (맵에 따라 다르게: 사막엔 없고, 산·설산엔 크고 가깝게)
  const rangeP = (bName==='MOUNTAIN'||bName==='ALPINE')? 1 : bName==='DESERT'? 0 : bName==='MEADOW'? 0.35 : bName==='COAST'? 0.4 : bName==='FOREST'? 0.6 : 0.55;
  if(rnd() < rangeP){
    const nR = (bName==='MOUNTAIN'||bName==='ALPINE')? 2 : 1;
    for(let i=0;i<nR;i++){
      const rx = ci*CHUNK + rnd()*CHUNK;
      let rSide = rnd()<0.5? -1: 1;
      if(bName==='COAST') rSide = -1; // 바다는 육지 쪽에만
      const rDist = bName==='ALPINE'? 200 + rnd()*90 : bName==='MOUNTAIN'? 250 + rnd()*100 : 300 + rnd()*130;
      const ridge = new THREE.Mesh(ridgeGeomInst, ridgeMat);
      const rs = bName==='ALPINE'? 1.4 + rnd()*0.7 : 1.0 + rnd()*0.6;
      ridge.scale.set(rs, rs*(0.9 + rnd()*0.3), rs);
      ridge.position.set(rx, -4, latAt(rx) + rSide*rDist);
      ridge.rotation.y = (rnd()-0.5)*0.5;
      group.add(ridge);
    }
  }

  // 바다 (교량 구간은 물이 양쪽으로)
  const palC = paletteAt3(centerX);
  if(palC.coast > 0.4){
    const wgeo = new THREE.PlaneGeometry(CHUNK, bz? 470 : 210);
    wgeo.rotateX(-Math.PI/2);
    const water = new THREE.Mesh(wgeo, waterMat);
    water.position.set(centerX, elevAt(centerX)-0.5, bz? latC : latC + 134);
    group.add(water);
  }

  // 교량: 다리 상판, 난간, 기둥
  if(bz){
    const z0 = bz[0], z1 = bz[1];
    const nSeg = Math.ceil((z1-z0)/6.5);
    const deck = new THREE.InstancedMesh(deckGeom, deckMat, nSeg);
    const rails2 = new THREE.InstancedMesh(rail2Geom, railMat, nSeg*2);
    for(let i=0;i<nSeg;i++){
      const s = z0 + i*6.5 + 3.25;
      pathPoint(s, _tp); pathPoint(s+2, _ta);
      const dx=_ta.x-_tp.x, dz=_ta.z-_tp.z, il=1/Math.hypot(dx,dz);
      const px=-dz*il, pz=dx*il;
      _dummy.position.set(_tp.x, _tp.y - 0.32, _tp.z);

function updateChunks(){
  const lo = Math.floor((headS-300)/CHUNK), hi = Math.floor((headS+820)/CHUNK);
  for(let ci=lo; ci<=hi; ci++) if(!chunks.has(ci)) buildChunk(ci);
  for(const [ci, g] of chunks){
    if(ci<lo || ci>hi){
      procGroup.remove(g);
      g.traverse(o=>{ if(o.geometry && o.geometry!==sleeperGeom && o.geometry!==railGeom && !SHARED_GEO.has(o.geometry)) o.geometry.dispose(); });
      BB_SET.delete(ci);
      chunks.delete(ci);
    }
  }
}

      _dummy.position.set(f.x + f.px*off, y - 0.1, f.z + f.pz*off);
      _dummy.rotation.set(0, rnd()*Math.PI*2, 0);
      _dummy.scale.set(sc, sc*(0.9+rnd()*0.25), sc);
      _dummy.updateMatrix();
      inst.setMatrixAt(placed++, _dummy.matrix);
    }
    inst.count = placed;
    inst.castShadow = true; inst.frustumCulled = false;
    group.add(inst);
  }
  _dummy.rotation.set(0,0,0); _dummy.scale.set(1,1,1);
  if(modelsSettled && MODELS.house && MODELS.house2){
    for(const p of REAL.pois){
      if(p.en === 'Lake Louise' || p.en === 'Banff' || p.en === 'Canmore'){
        if(s0 < p.s + 350 && s0 + RSTEP > p.s - 350){
          const nH = p.en === 'Banff' ? 7 : 5;
          for(let i=0;i<nH;i++){
            const s = p.s + (rnd()-0.5) * 620;
            if(s < s0 || s > s0 + RSTEP) continue;
            const side = rnd()<0.5? -1 : 1;
            const off = side * (55 + rnd()*170);
            const f = pathFrameR(s);
            const house = buildModelHouse(Math.floor(rnd()*2));
            house.position.set(f.x + f.px*off, terrainHR(s, off) - 0.05, f.z + f.pz*off);
            house.rotation.y = Math.atan2(f.px*side, f.pz*side) + (rnd()-0.5)*0.5;
            group.add(house);
          }
        }
      }
    }
  }
  REAL.group.add(group);
  REAL.chunks.set(ci, group);
  loadSatTexture(ci, group, terrain, new Float32Array(tint));
}
function updateChunksR(){
  const lo = Math.floor((headSR-950)/RSTEP), hi = Math.floor((headSR+950)/RSTEP);
  for(let ci=lo; ci<=hi; ci++){ if(ci < 0 || ci*RSTEP > REAL.total) continue; if(!REAL.chunks.has(ci)) buildChunkR(ci); }
  for(const [ci, g] of REAL.chunks){
    if(ci<lo || ci>hi){
      REAL.group.remove(g);
      g.traverse(o=>{ if(o.geometry && o.geometry!==sleeperGeom && o.geometry!==railGeom && !SHARED_GEO.has(o.geometry)) o.geometry.dispose(); if(o.userData.ownMat){ if(o.material.map) o.material.map.dispose(); o.material.dispose(); } });
      REAL.chunks.delete(ci);
    }
  }
}
function placeTrainR(){
  for(const c of cars){
    const cs = headSR - realDir * c.centerOff;
    pathPointR(cs, _pp);
    pathPointR(cs + realDir*8, _pa);
    c.group.position.set(_pp.x, _pp.y + TRACK_TOP, _pp.z);
    c.group.lookAt(_pa.x, _pa.y + TRACK_TOP, _pa.z);
  }
  const loco = cars[0];
  loco.group.localToWorld(locoStack.copy(trainSets[activeSet].stack));
}
function updateCameraR(dt, t){
  pathPointR(headSR - realDir*20, _ctr);
  pathPointR(headSR + realDir*6, _pa); pathPointR(headSR - realDir*30, _pp);
  _fwd.copy(_pa).sub(_pp).setY(0).normalize();
  _rgt.crossVectors(_fwd, UP).normalize().negate();
  const locoP = cars[0].group.position;
  let snap = 2.6;
  if(camMode===0){
    const ang = Math.sin(t*0.06)*0.95 + 0.55;
    _want.copy(_ctr).addScaledVector(_fwd, Math.cos(ang)*30).addScaledVector(_rgt, Math.sin(ang)*30);
    _want.y = _ctr.y + 8.5 + Math.sin(t*0.11)*1.6;
    _look.copy(_ctr); _look.y += 2.5;
  } else if(camMode===1){
    _want.copy(_ctr).addScaledVector(_rgt, 23); _want.y = _ctr.y + 5;
    _look.copy(_ctr); _look.y += 2.4;
  } else if(camMode===2){
    _want.copy(locoP).addScaledVector(_fwd, 7.0); _want.y = locoP.y + 3.35;
    pathPointR(headSR + realDir*55, _look); _look.y += 1.2;
    snap = 14;
  } else {
    _want.copy(_ctr).addScaledVector(_fwd, -30); _want.y = _ctr.y + 30;
    _look.copy(_ctr); _look.y += 1;
  }
  if(!camInit){ camera.position.copy(_want); camInit = true; }
  else camera.position.lerp(_want, 1 - Math.exp(-dt*snap));
  camera.lookAt(_look);
}
function setMode(m){
  if(mode === m) return;
  mode = m;
  procGroup.visible = m === 'dream';
  REAL.group.visible = m === 'real';
  document.getElementById('mapcredit').style.display = m === 'real' ? 'block' : 'none';
  document.getElementById('nextpoi').style.display = m === 'real' ? 'block' : 'none';
  camInit = false;
  if(m === 'real'){ lastPoi = ''; announce({ name:'캐나다 로키 · 실제 노선', sub:'CPKC · LAKE LOUISE → CANMORE' }); }
  else lastBiome = -1;
  markMapChip();
}

/* ================= state / UI ================= */
let playing = true, speedMul = 1, headS = 30, elapsed = 0, lastBiome = -1;
const regionEl = document.getElementById('region');
const clockEl = document.getElementById('clock');

/* 맵 선택 버튼 */
const MAP_LABELS = ["초원", "숲", "바다", "사막", "노을", "눈 마을", "설산", "밤"];
const mapChips = [];
let realChip = null;
{
  const bar = document.getElementById('mapbar');

function jumpToBiome(idx){
  if(mode !== 'dream') setMode('dream');
  const n = PALS.length, ci = Math.floor(headS/SEG3);
  for(let k=0;k<=n;k++){
    const cand = ci + k;
    if(((cand % n) + n) % n === idx){ headS = cand*SEG3 + 30; break; }
  }
  lastBiome = -1;
}
function markMapChip(){
  const n = PALS.length;
  const cur = ((biomeIndexAt3(headS) % n) + n) % n;
  mapChips.forEach((b, i)=> b.classList.toggle('on', mode === 'dream' && i === cur));
  if(realChip) realChip.classList.toggle('on', mode === 'real');
}
let audioCtx=null, audioOn=false, padTimer=null, masterGain=null, chordIdx=0;
function ensureAudio(){
  if(audioCtx){ if(audioCtx.state==='suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = audioCtx.createGain(); masterGain.gain.value = 0.9;
  masterGain.connect(audioCtx.destination);
  // 기차 바람 소리 베드
  const nbuf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
  const nd = nbuf.getChannelData(0);
  let lastV = 0;
  for(let i=0;i<nd.length;i++){ const w = Math.random()*2-1; lastV = (lastV + 0.02*w)/1.02; nd[i] = lastV*3.2; }
  const nsrc = audioCtx.createBufferSource(); nsrc.buffer = nbuf; nsrc.loop = true;
  const nf = audioCtx.createBiquadFilter(); nf.type = "lowpass"; nf.frequency.value = 420;
  const ng = audioCtx.createGain(); ng.gain.value = 0.03;
  nsrc.connect(nf); nf.connect(ng); ng.connect(masterGain); nsrc.start();
}
function padChord(){
  if(!audioCtx || !audioOn) return;
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const chords = [[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];
  const t = audioCtx.currentTime + 0.05;
  chords[chordIdx % chords.length].forEach(f=>{
    // 폰 스피커에서도 들리게: 삼각파(배음) + 한 옥타브 위 사인 반짝임
    const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
    o1.type = "triangle"; o1.frequency.value = f;
    g1.gain.setValueAtTime(0, t); g1.gain.linearRampToValueAtTime(0.11, t+1.4);
    g1.gain.linearRampToValueAtTime(0.0001, t+7.6);
    o1.connect(g1); g1.connect(masterGain); o1.start(t); o1.stop(t+7.8);
    const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
    o2.type = "sine"; o2.frequency.value = f*2;
    g2.gain.setValueAtTime(0, t); g2.gain.linearRampToValueAtTime(0.035, t+1.8);
    g2.gain.linearRampToValueAtTime(0.0001, t+7.6);
    o2.connect(g2); g2.connect(masterGain); o2.start(t); o2.stop(t+7.8);
  });
  chordIdx++;
}
function playChime(){ // 켜는 순간 바로 들리는 확인음 (부드러운 종소리 두 음)
  if(!audioCtx) return;
  const t = audioCtx.currentTime + 0.03;
  [[523.25, 0], [783.99, 0.14]].forEach(([f, dt])=>{
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t+dt); g.gain.linearRampToValueAtTime(0.14, t+dt+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dt+1.4);
    o.connect(g); g.connect(masterGain); o.start(t+dt); o.stop(t+dt+1.5);
  });
}
function toggleAudio(){
  if(audioOn){
    audioOn=false; clearInterval(padTimer);
    if(audioCtx) audioCtx.suspend();
    document.getElementById('soundBtn').textContent="소리 켜기"; return;
  }
  ensureAudio();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  audioOn=true;
  playChime(); padChord(); padTimer=setInterval(padChord, 7000);
  document.getElementById('soundBtn').textContent="소리 끄기";
}
document.getElementById('soundBtn').addEventListener('click', toggleAudio);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && audioOn && audioCtx && audioCtx.state==='suspended') audioCtx.resume();
});
if(navigator.wakeLock){ navigator.wakeLock.request('screen').catch(()=>{}); }
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ================= camera ================= */
const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _ctr = new THREE.Vector3(), _want = new THREE.Vector3(), _look = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);
let camInit = false;
function updateCamera(dt, t){
  pathPoint(headS - 20, _ctr);
  pathPoint(headS + 6, _pa); pathPoint(headS - 30, _pp);
  _fwd.copy(_pa).sub(_pp).setY(0).normalize();
  _rgt.crossVectors(_fwd, UP).normalize().negate();
  const locoP = cars[0].group.position;
  let snap = 2.6;
  if(camMode===0){ // 영화: 천천히 도는 시네마틱
    const ang = Math.sin(t*0.06)*0.95 + 0.55;
    _want.copy(_ctr).addScaledVector(_fwd, Math.cos(ang)*30).addScaledVector(_rgt, Math.sin(ang)*30);
    _want.y = _ctr.y + 8.5 + Math.sin(t*0.11)*1.6;
    _look.copy(_ctr); _look.y += 2.5;
  } else if(camMode===1){ // 옆에서 따라가기
    _want.copy(_ctr).addScaledVector(_rgt, 23); _want.y = _ctr.y + 5;
    _look.copy(_ctr); _look.y += 2.4;
  } else if(camMode===2){ // 기관실
    _want.copy(locoP).addScaledVector(_fwd, 7.0); _want.y = locoP.y + 3.35;
    pathPoint(headS + 55, _look); _look.y += 1.2;
    snap = 14;
  } else { // 위에서
    _want.copy(_ctr).addScaledVector(_fwd, -30); _want.y = _ctr.y + 30;
    _look.copy(_ctr); _look.y += 1;
  }
  if(!camInit){ camera.position.copy(_want); camInit = true; }
  else camera.position.lerp(_want, 1 - Math.exp(-dt*snap));
  camera.lookAt(_look);
}

/* HDRI 환경광이 너무 세지 않게 */
[terrainMat, ballastMat, foliageMat, mesaMat, ridgeMat, waterMat, deckMat, iceMat, modelMat, ...fieldMats].forEach(m=>{ m.envMapIntensity = 0.5; });
waterMat.envMapIntensity = 0.95;

/* ================= main loop ================= */
const winDay = new THREE.Color(0x2b3e4f), winNight = new THREE.Color(0xffca7a), _wc = new THREE.Color();
let panoWas = false, panoSub = '';
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min((now-last)/1000, 0.05)); last = now;
  const speed = 15 * speedMul;
  if(playing){
    elapsed += dt;
    if(mode === 'real' && REAL.ready){
      headSR += realDir * speed * dt;
      if(headSR > REAL.total - 420) realDir = -1;
      else if(headSR < 420) realDir = 1;
    } else headS += speed * dt;
  }

  if(mode === 'real' && REAL.ready){ updateChunksR(); placeTrainR(); }
  else { if(modelsSettled) updateChunks(); placeTrain(); }
  if(mode === 'dream' && bbMat){
    for(const lst of BB_SET.values()){
      for(const ent of lst){
        for(let i=0;i<ent.items.length;i++){
          const it = ent.items[i];
          _dummy.position.set(it.x, it.y, it.z);
          _dummy.rotation.set(0, Math.atan2(camera.position.x - it.x, camera.position.z - it.z), 0);
          const sc = it.h/2; _dummy.scale.set(sc * (it.flip? -1 : 1), sc, sc);
          _dummy.updateMatrix();
          ent.im.setMatrixAt(i, _dummy.matrix);
        }
        ent.im.instanceMatrix.needsUpdate = true;
      }
    }
    _dummy.rotation.set(0,0,0); _dummy.scale.set(1,1,1);
  }
  if(playing){
    const wAng = speed*dt/0.48 * (mode === 'real'? realDir : 1);
    for(const w of trainWheels) w.rotation.x -= wAng;
  }
  updateSmoke(dt);

  const pal = mode === 'real' ? REAL_PAL : paletteAt3(headS);
  scene.fog.color.copy(pal.sky);
  scene.fog.far = mode === 'real' ? 2500 : 720;
  const wantSky = mode === 'real' ? 'day'
    : pal.night > 0.6 ? 'gradient'
    : (biomeAt3(headS).sub === 'SUNSET' || biomeAt3(headS).sub === 'DESERT') ? 'sunset' : 'day';
  const _sub = mode === 'dream' ? biomeAt3(headS).sub : '';
  const wantPanoTex = (mode === 'dream' && pal.night <= 0.6) ? (panoTexs[_sub] || null) : null;
  const wantPano = !!wantPanoTex;
  const wantGroundMap = mode === 'dream' ? (groundTexs[_sub] || noiseTex) : noiseTex;
  if(terrainMat.map !== wantGroundMap){ terrainMat.map = wantGroundMap; terrainMat.needsUpdate = true; }
  if(wantPano !== panoWas){
    panoWas = wantPano;
    ridgeMat.transparent = wantPano;
    ridgeMat.opacity = wantPano ? 0 : 1;
    ridgeMat.needsUpdate = true;
  }
  if(wantPano){
    panoMesh.visible = true;
    panoMesh.position.set(camera.position.x, camera.position.y - 40, camera.position.z);
    if(panoMesh.material.map !== wantPanoTex){ panoMesh.material.map = wantPanoTex; panoMesh.material.needsUpdate = true; }
    if(skyMode !== 'pano' || panoSub !== _sub){
      panoSub = _sub;
      scene.background = bgColor; bgColor.set(PANO_BG[_sub] || 0x9db9dc);
      skyDome.visible = false;
      const ek = _sub === 'DESERT' ? 'sunset' : 'day';
      if(skyTexs[ek]){ if(!envCache[ek]) envCache[ek] = pmrem.fromEquirectangular(skyTexs[ek]).texture; scene.environment = envCache[ek]; }
      skyMode = 'pano';
    }
  } else {
    if(panoMesh.visible){ panoMesh.visible = false; if(skyMode === 'pano') skyMode = ''; }
    if(wantSky !== skyMode){
      if(wantSky === 'gradient'){
        scene.background = bgColor; scene.environment = null; skyDome.visible = true; skyMode = 'gradient';
      } else if(skyTexs[wantSky]){
        scene.background = skyTexs[wantSky]; skyDome.visible = false;
        if(!envCache[wantSky]) envCache[wantSky] = pmrem.fromEquirectangular(skyTexs[wantSky]).texture;
        scene.environment = envCache[wantSky];
        skyMode = wantSky;
      }
    }
  }
  if(skyMode === 'gradient'){
    if(scene.background !== bgColor) scene.background = bgColor;
    bgColor.copy(pal.sky);
    skyDome.position.copy(camera.position);
    _skyTop.copy(pal.sky).lerp(_black, 0.14); _skyBot.copy(pal.sky).lerp(_white, 0.3);
    skyMat.uniforms.top.value.copy(_skyTop); skyMat.uniforms.bot.value.copy(_skyBot);
  }
  hemi.color.copy(pal.sky); hemi.groundColor.copy(pal.gB); hemi.intensity = pal.hemiI;
  sun.color.copy(pal.sun); sun.intensity = pal.sunI;
  ridgeMat.color.copy(pal.far);
  const tp = cars[0].group.position;
  sun.position.set(tp.x + 190, tp.y + 260, tp.z + 130);
  sun.target.position.copy(tp);
  starMat.opacity = pal.night * 0.95;
  moonMat.opacity = pal.night * 0.95;
  moon.position.copy(camera.position).add(_moonDir);
  moon.lookAt(camera.position);
  snowMat.opacity = pal.snow * 0.95;
  if(pal.snow > 0.02) updateSnow(dt, now/1000);
  stars.position.copy(camera.position);
  _wc.copy(winDay).lerp(winNight, pal.night);
  winMat.color.copy(_wc); houseWinMat.color.copy(_wc); lampMat.color.copy(_wc);
  if(headlight) headlight.intensity = pal.night * 2.4;
  waterMat.color.copy(pal.sky).lerp(new THREE.Color(0x1d6ea8), 0.72);

  // 구름 드리프트
  if(mode === 'real'){
    cloudGroup.position.set(tp.x, 0, tp.z);
    for(const cl of cloudGroup.children){
      cl.position.x += dt*1.3;
      if(cl.position.x > 1100) cl.position.x -= 1700;
      if(cl.position.x < -600) cl.position.x += 1700;
    }
  } else {
    cloudGroup.position.set(0, 0, 0);
    for(const cl of cloudGroup.children){
      cl.position.x += dt*1.3;
      if(cl.position.x < headS - 800) cl.position.x += 1700;
      if(cl.position.x > headS + 900) cl.position.x -= 1700;
    }
  }

  if(mode === 'real') updateCameraR(dt, elapsed);
  else updateCamera(dt, elapsed);

  if(mode === 'real'){
    let near = null, nd = 1e9;
    for(const p of REAL.pois){ const d = Math.abs(p.s - headSR); if(d < nd){ nd = d; near = p; } }
    const key = (near && nd < 700) ? near.name : '';
    if(key !== lastPoi){ lastPoi = key; if(key) announce({ name: near.name + ' · ' + near.en, sub:'CANADIAN ROCKIES' }); }
    let ahead = null, ad = 1e18;
    for(const p of REAL.pois){ const d = (p.s - headSR) * realDir; if(d > 250 && d < ad){ ad = d; ahead = p; } }
    let npTxt = ahead ? `다음 · ${ahead.name} ${ahead.en} — ${(ad/1000).toFixed(1)} km`
      : (realDir > 0 ? '종점 · 캔모어 Canmore' : '종점 · 레이크 루이스 Lake Louise');
    npTxt += `<br>레이크 루이스 ——— ${Math.round(headSR / REAL.total * 100)}% ——— 캔모어`;
    if(npTxt !== lastNpTxt){ lastNpTxt = npTxt; document.getElementById('nextpoi').innerHTML = npTxt; }
  } else {
    const bi = biomeIndexAt3(headS);
    if(bi !== lastBiome){ lastBiome = bi; announce(biomeAt3(headS)); markMapChip(); }
  }
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(Math.floor(elapsed%60)).padStart(2,'0');
  clockEl.textContent = `${mm}:${ss}`;
  renderer.render(scene, camera);
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r => { if(r.update) r.update(); }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(window.__swReloaded) return; window.__swReloaded = true; location.reload();
  });
}
announce(PALS[0]);
document.getElementById('loading').style.display='none';
requestAnimationFrame(frame);
