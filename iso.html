<style>

  html,body{height:100%;overflow:hidden;background:#20301f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,16,8,.28) 100%)}

    text-shadow:0 1px 8px rgba(0,0,0,.55);opacity:.95;pointer-events:none}

  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.85;margin-top:6px}
  #bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));
    display:flex;gap:8px;align-items:center;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:999px;color:#fff}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}

</style>
