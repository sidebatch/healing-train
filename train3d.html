<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어디든 가는 기차 — 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d1626;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  canvas{display:block}
  #title{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;color:#fff;font-size:14px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.55);opacity:.95;pointer-events:none;z-index:5}
  #title small{display:block;font-size:11px;opacity:.78;margin-top:2px}
  #title a{color:#cfe6ff;pointer-events:auto;text-decoration:none;border-bottom:1px dotted #cfe6ff}
  #region{position:fixed;top:20%;left:50%;transform:translateX(-50%);color:#fff;font-size:clamp(20px,4.5vw,34px);
    font-weight:600;letter-spacing:.14em;text-shadow:0 2px 18px rgba(0,0,0,.65);opacity:0;transition:opacity 1.2s ease;pointer-events:none;text-align:center;white-space:nowrap;z-index:5}
  #region small{display:block;font-size:12px;font-weight:400;letter-spacing:.3em;opacity:.85;margin-top:6px}
  #ui{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:5;
    display:flex;flex-direction:column;align-items:center;gap:8px;max-width:97vw}
  #bar{display:flex;gap:8px;align-items:center;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);
    padding:8px 12px;border-radius:999px;color:#fff;max-width:97vw;flex-wrap:wrap;justify-content:center}
  #bar button{border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:8px 13px;font-size:13px;cursor:pointer}
  #bar button:active{background:rgba(255,255,255,.32)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;opacity:.9;min-width:44px;text-align:center}
  #mapbar{display:flex;gap:6px;background:rgba(10,14,24,.42);backdrop-filter:blur(8px);padding:7px 10px;border-radius:999px;
    max-width:97vw;overflow-x:auto;scrollbar-width:none}
  @media (max-width:560px){
    #bar button{padding:7px 10px;font-size:12px}
    #mapbar button{padding:6px 10px;font-size:12px}
  }
  #mapbar::-webkit-scrollbar{display:none}
  #mapbar button{border:0;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;padding:7px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  #mapbar button.on{background:#fff;color:#16222e;font-weight:700}
  #err{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);max-width:86vw;background:rgba(120,20,20,.92);color:#fff;
    padding:14px 18px;border-radius:12px;font-size:13px;line-height:1.5;display:none;z-index:9;white-space:pre-wrap}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#dfeaf5;font-size:15px;letter-spacing:.06em;z-index:4}
</style>
</head>
<body>

<div id="title">어디든 가는 기차 · 3D<small>실시간 3D 버전입니다 · <a href="iso.html">2D 아이소 버전</a></small></div>

<script src="assets/three.min.js"></script>
<script>
"use strict";
const errBox = document.getElementById('err');
window.addEventListener('error', e=>{
  errBox.style.display='block';
  errBox.textContent = '오류가 생겼어요: ' + (e.message || e.type);
});
if(typeof THREE === 'undefined'){
  errBox.style.display='block'; errBox.textContent='3D 라이브러리를 불러오지 못했어요.';
  throw new Error('THREE missing');
}

/* ================= helpers ================= */
function hash(n){ const s = Math.sin(n*127.1+311.7)*43758.5453; return s - Math.floor(s); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smooth(t){ return t*t*(3-2*t); }
let _seed = 123456789;
function srand(seed){ _seed = seed>>>0 || 1; }
function rnd(){ _seed = (_seed*16807)%2147483647; return (_seed-1)/2147483646; }

/* ================= biome palettes ================= */
const SEG3 = 820, BLEND3 = 230;
const PALS = [
  { name:"아침 초원", sub:"MEADOW", sky:0xa9cfee, gA:0x79b657, gB:0x639e47, far:0x8fb98a, sun:0xfff2d8, sunI:1.2, hemiI:0.75, night:0, coast:0, alpine:0, snow:0 },
  { name:"깊은 숲",   sub:"FOREST", sky:0x9ec9b4, gA:0x4f8a45, gB:0x3d7038, far:0x5d8a66, sun:0xf2ffd8, sunI:1.05, hemiI:0.65, night:0, coast:0, alpine:0, snow:0, mount:0 },
  { name:"산", sub:"MOUNTAIN", sky:0xa8c8e0, gA:0x6f9a52, gB:0x5d8a48, far:0x7d9b84, sun:0xfff6e0, sunI:1.15, hemiI:0.7, night:0, coast:0, alpine:0, snow:0, mount:1 },
  { name:"바닷가",    sub:"COAST",  sky:0xa5dcf2, gA:0x79b657, gB:0x679e4c, far:0x7fb2c9, sun:0xfff6d8, sunI:1.25, hemiI:0.8, night:0, coast:1, alpine:0, snow:0 },
  { name:"노을 사막", sub:"DESERT", sky:0xf2c48d, gA:0xddba68, gB:0xcaa050, far:0xc98d5a, sun:0xffd9a0, sunI:1.3, hemiI:0.7, night:0.15, coast:0, alpine:0, snow:0 },
  { name:"눈 내리는 마을", sub:"SNOW", sky:0xcfdde8, gA:0xf0f5f9, gB:0xdfe9f1, far:0xb9cbd8, sun:0xeef4ff, sunI:1.0, hemiI:0.8, night:0, coast:0, alpine:0, snow:0.8 },
  { name:"설산", sub:"ALPINE", sky:0xd7e6f2, gA:0xeef3f7, gB:0xd3dee8, far:0xa9bfd2, sun:0xf4f8ff, sunI:1.15, hemiI:0.85, night:0, coast:0, alpine:1, snow:1 },
  { name:"밤하늘 아래", sub:"NIGHT", sky:0x0d1626, gA:0x274434, gB:0x1f382a, far:0x1c2b3a, sun:0x93b8ff, sunI:0.22, hemiI:0.22, night:1, coast:0, alpine:0, snow:0 },
];
const _ca = new THREE.Color(), _cb = new THREE.Color();
function lerpCol(out, a, b, t){ _ca.setHex(a); _cb.setHex(b); out.copy(_ca).lerp(_cb, t); return out; }
function biomeIndexAt3(s){ return Math.floor(s/SEG3); }
function biomeAt3(s){ const i=biomeIndexAt3(s); return PALS[((i%PALS.length)+PALS.length)%PALS.length]; }
function paletteAt3(s){
  const i = biomeIndexAt3(s);
  const cur = PALS[((i%PALS.length)+PALS.length)%PALS.length];
  const nxt = PALS[(((i+1)%PALS.length)+PALS.length)%PALS.length];
  const into = s - i*SEG3;
  const t = smooth(clamp((into-(SEG3-BLEND3))/BLEND3, 0, 1));
  const o = { name:cur.name, sub:cur.sub, sky:new THREE.Color(), gA:new THREE.Color(), gB:new THREE.Color(), far:new THREE.Color(), sun:new THREE.Color(),
    sunI:lerp(cur.sunI,nxt.sunI,t), hemiI:lerp(cur.hemiI,nxt.hemiI,t), night:lerp(cur.night,nxt.night,t), coast:lerp(cur.coast,nxt.coast,t),
    alpine:lerp(cur.alpine,nxt.alpine,t), snow:lerp(cur.snow,nxt.snow,t), mount:lerp(cur.mount||0,nxt.mount||0,t) };
  lerpCol(o.sky, cur.sky, nxt.sky, t); lerpCol(o.gA, cur.gA, nxt.gA, t);
  lerpCol(o.gB, cur.gB, nxt.gB, t); lerpCol(o.far, cur.far, nxt.far, t); lerpCol(o.sun, cur.sun, nxt.sun, t);
  return o;
}

/* ================= world path ================= */
const ALP_W = PALS.map(p=>p.alpine||0), MNT_W = PALS.map(p=>p.mount||0);
function biomeW(s, arr){
  const i = Math.floor(s/SEG3), n = arr.length;
  const cur = arr[((i%n)+n)%n], nxt = arr[(((i+1)%n)+n)%n];
  const into = s - i*SEG3;
  const t = smooth(clamp((into-(SEG3-BLEND3))/BLEND3, 0, 1));
  return lerp(cur, nxt, t);
}
function alpineW(s){ return biomeW(s, ALP_W); }
function mountW(s){ return biomeW(s, MNT_W); }
function latAt(s){ return Math.sin(s*0.004)*90 + Math.sin(s*0.0011+1.3)*140 + Math.sin(s*0.00023+0.5)*180; }
function elevAt(s){
  const base = Math.sin(s*0.0021+0.7)*4.5 + Math.sin(s*0.0006)*7 + Math.sin(s*0.0053)*1.6;
  const aw = alpineW(s), mw = mountW(s);
  return base
    + aw * (11 + Math.sin(s*0.0013+2.0)*5.5 + Math.sin(s*0.0042)*1.4)   // 설산은 높이
    + mw * (7 + Math.sin(s*0.0017+0.9)*3.2 + Math.sin(s*0.005)*1.0);     // 산은 중간 높이로 오른다
}
const _pv = new THREE.Vector3();
function pathPoint(s, out){ return (out||_pv).set(s, elevAt(s), latAt(s)); }
function groundH(x, z){
  const lz = latAt(x), e = elevAt(x);
  const palG = paletteAt3(x);
  const sd = z - lz, d = Math.abs(sd);
  const t = clamp((d-16)/90, 0, 1), tt = t*t;
  const rugged = 1 + palG.alpine*1.9 + palG.mount*1.25; // 산·설산은 지형이 험하게
  let h = e + (Math.sin(x*0.011+z*0.017)*2.2 + Math.sin(x*0.004-z*0.006+2)*4.5 + Math.sin((x+z)*0.0016)*7) * tt * rugged;
  const cf = palG.coast;
  if(cf > 0.03 && sd > 0){ // 바닷가 쪽은 해변처럼 낮아짐
    const sink = smooth(clamp((sd-16)/46, 0, 1));
    h = lerp(h, e - 2.6, cf * sink * (1 - tt*0.4));
  }
  return h;
}

/* ================= renderer / scene ================= */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cfee);
scene.fog = new THREE.Fog(0xa9cfee, 130, 720);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms: { top: { value: new THREE.Color(0x8fc3e8) }, bot: { value: new THREE.Color(0xd8ecfa) } },
  vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
  fragmentShader: "uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.7+0.10, 0.0, 1.0); gl_FragColor = vec4(mix(bot, top, pow(h,0.75)), 1.0); }"
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1500, 24, 12), skyMat);
skyDome.frustumCulled = false;
scene.add(skyDome);
const _skyTop = new THREE.Color(), _skyBot = new THREE.Color(), _white = new THREE.Color(0xffffff), _black = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 2400);
camera.position.set(-30, 14, 60);

const hemi = new THREE.HemisphereLight(0xbfd9ea, 0x53684a, 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 1.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -160; sun.shadow.camera.right = 160;
sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -160;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 800;
sun.shadow.bias = -0.0006;
scene.add(sun); scene.add(sun.target);

/* ================= canvas textures ================= */
function canvasTex(w, h, draw, repeat){
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  if(repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = 4;
  return t;
}
const noiseTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle="#f4f4f4"; g.fillRect(0,0,w,h);
  srand(4242);
  for(let i=0;i<5200;i++){
    const v = 205 + Math.floor(rnd()*50);
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(rnd()*w, rnd()*h, 1+rnd()*2.2, 1+rnd()*2.2);
  }
}, true);
const gravelTex = canvasTex(256, 256, (g,w,h)=>{
  g.fillStyle="#6f675c"; g.fillRect(0,0,w,h);
  srand(777);
  for(let i=0;i<2400;i++){
    const v = 78 + Math.floor(rnd()*70);
    g.fillStyle = `rgb(${v+14},${v+6},${v-6})`;
    g.beginPath(); g.ellipse(rnd()*w, rnd()*h, 1+rnd()*2.6, 1+rnd()*1.8, rnd()*3, 0, Math.PI*2); g.fill();
  }
}, true);
const smokeTex = canvasTex(128, 128, (g,w,h)=>{
  const gr = g.createRadialGradient(64,64,4, 64,64,60);
  gr.addColorStop(0, "rgba(255,255,255,.85)"); gr.addColorStop(0.55, "rgba(255,255,255,.38)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0,0,w,h);
});
const windowStripTex = canvasTex(1024, 64, (g,w,h)=>{
  g.clearRect(0,0,w,h);
  g.fillStyle="#ffffff";
  const n=9, ww=74, gap=(w - n*ww)/(n+1);
  for(let i=0;i<n;i++){
    const x = gap + i*(ww+gap);
    g.beginPath(); g.roundRect(x, 9, ww, 46, 7); g.fill();
  }
});
function carSideTexture(hex, isLoco){
  return canvasTex(1024, 256, (g,w,h)=>{
    const col = "#" + hex.toString(16).padStart(6,'0');
    const grad = g.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, col); grad.addColorStop(0.78, col); grad.addColorStop(1, "rgba(0,0,0,0.34)");
    g.fillStyle = grad; g.fillRect(0,0,w,h);
    g.fillStyle = "rgba(255,255,255,.30)"; g.fillRect(0, 148, w, 9);       // 띠
    g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(0, 218, w, 38);          // 아래 스커트
    g.fillStyle = "rgba(255,255,255,.13)"; g.fillRect(0, 6, w, 20);       // 지붕쪽 하이라이트
    g.strokeStyle = "rgba(0,0,0,.22)"; g.lineWidth = 2;                   // 패널 이음선
    for(let x=128; x<w; x+=128){ g.beginPath(); g.moveTo(x, 26); g.lineTo(x, 214); g.stroke(); }
    for(const dx of [26, w-104]){                                          // 문
      g.strokeStyle="rgba(0,0,0,.4)"; g.lineWidth=3; g.strokeRect(dx, 40, 78, 176);
      g.fillStyle="rgba(16,26,36,.85)"; g.fillRect(dx+12, 56, 54, 52);
    }
    g.fillStyle="rgba(0,0,0,.3)";                                          // 환기구
    for(let i=0;i<5;i++) g.fillRect(300+i*30, 226, 18, 5);
    g.fillStyle="rgba(255,255,255,.75)"; g.font="bold 30px sans-serif";
    g.fillText(isLoco? "HT-7100" : "HEALING LINE", 396, 197);
    if(isLoco){ g.fillStyle="rgba(16,26,36,.9)"; g.fillRect(w-238, 44, 128, 74); } // 운전실 창
  });
}
function locoFrontTexture(){
  return canvasTex(256, 256, (g,w,h)=>{
    g.fillStyle="#2c4356"; g.fillRect(0,0,w,h);
    g.fillStyle="#101c26"; g.fillRect(28, 34, 88, 62); g.fillRect(140, 34, 88, 62);   // 앞유리
    g.fillStyle="rgba(255,255,255,.22)"; g.fillRect(28, 34, 88, 16); g.fillRect(140, 34, 88, 16);
    g.fillStyle="#0d141b"; g.fillRect(48, 150, 160, 58);                              // 그릴
    g.strokeStyle="rgba(255,255,255,.16)"; for(let y=158; y<204; y+=9){ g.beginPath(); g.moveTo(52,y); g.lineTo(204,y); g.stroke(); }
    for(const lx of [44, 196]){ g.fillStyle="#ffe9a8"; g.beginPath(); g.arc(lx+8, 122, 11, 0, Math.PI*2); g.fill();
      g.fillStyle="#8a6d1f"; g.beginPath(); g.arc(lx+8, 122, 12.5, 0, Math.PI*2); g.stroke(); }
    g.fillStyle="#e8b23a"; g.fillRect(0, 226, w, 16);                                  // 경고 띠
    g.fillStyle="rgba(0,0,0,.55)"; for(let x=8; x<w; x+=32) g.fillRect(x, 226, 16, 16);
  });
}
/* ================= geometry helpers ================= */
function colored(geom, hex){
  const g = geom.index ? geom.toNonIndexed() : geom;
  const n = g.attributes.position.count;
  const col = new THREE.Color(hex);
  const arr = new Float32Array(n*3);
  for(let i=0;i<n;i++){ arr[i*3]=col.r; arr[i*3+1]=col.g; arr[i*3+2]=col.b; }
  g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return g;
}
function xform(geom, x,y,z, rx,ry,rz, sx,sy,sz){
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0, ry||0, rz||0));
  m.compose(new THREE.Vector3(x,y,z), q, new THREE.Vector3(sx===undefined?1:sx, sy===undefined?1:sy, sz===undefined?1:sz));
  geom.applyMatrix4(m);
  return geom;
}
function mergeGeoms(list){
  let total=0; list.forEach(g=>total+=g.attributes.position.count);
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2), col=new Float32Array(total*3);
  let o=0, o2=0;
  for(const g of list){
    const p=g.attributes.position, n=g.attributes.normal, u=g.attributes.uv, c=g.attributes.color;
    pos.set(p.array, o*3); nor.set(n.array, o*3); col.set(c.array, o*3);
    if(u) uv.set(u.array, o2); 
    o += p.count; o2 += p.count*2;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv,2));
  out.setAttribute('color', new THREE.BufferAttribute(col,3));
  return out;
}
const foliageMat = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.95, metalness:0 });
function pineGeom(snow){
  const parts = [
    colored(xform(new THREE.CylinderGeometry(0.15,0.22,1.3,6), 0,0.65,0), 0x5b4632),
    colored(xform(new THREE.ConeGeometry(1.55,2.7,8), 0,2.5,0), 0x2c5c24),
    colored(xform(new THREE.ConeGeometry(1.18,2.3,8), 0,3.9,0), 0x356b2c),
    colored(xform(new THREE.ConeGeometry(0.8,1.9,8), 0,5.2,0), 0x3e7d32),
  ];
  if(snow){
    parts.push(colored(xform(new THREE.ConeGeometry(0.85,1.4,8), 0,4.15,0), 0xf4f9fc));
    parts.push(colored(xform(new THREE.ConeGeometry(0.55,1.1,8), 0,5.45,0), 0xf4f9fc));
    parts.push(colored(xform(new THREE.ConeGeometry(1.15,1.6,8), 0,2.8,0), 0xe8f1f7));
  }
  return mergeGeoms(parts);
}
function roundGeom(){
  return mergeGeoms([
    colored(xform(new THREE.CylinderGeometry(0.17,0.24,1.7,6), 0,0.85,0), 0x5b4632),
    colored(xform(new THREE.IcosahedronGeometry(1.65,0), 0,3.2,0), 0x3e7d32),
    colored(xform(new THREE.IcosahedronGeometry(1.15,0), 1.0,2.55,0.35), 0x356b2c),
    colored(xform(new THREE.IcosahedronGeometry(1.05,0), -0.9,2.65,-0.3), 0x477f2e),
  ]);
}
function palmGeom(){
  const parts = [ colored(xform(new THREE.CylinderGeometry(0.13,0.19,1.7,6), 0,0.85,0, 0,0,0.1), 0x7a6248) ];
  parts.push(colored(xform(new THREE.CylinderGeometry(0.11,0.14,1.7,6), 0.28,2.4,0, 0,0,0.3), 0x7a6248));
  parts.push(colored(xform(new THREE.CylinderGeometry(0.09,0.12,1.6,6), 0.78,3.8,0, 0,0,0.5), 0x86704f));
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    parts.push(colored(xform(new THREE.ConeGeometry(0.42,3.1,5), 1.35+Math.cos(a)*1.05, 4.75, Math.sin(a)*1.05, Math.sin(a)*1.15, 0, -Math.cos(a)*1.15, 1, 1, 0.28), 0x3e7d32));
  }
  parts.push(colored(xform(new THREE.SphereGeometry(0.2,6,5), 1.2,4.35,0.25), 0x7a5c2e));
  parts.push(colored(xform(new THREE.SphereGeometry(0.18,6,5), 1.5,4.3,-0.2), 0x7a5c2e));
  return mergeGeoms(parts);
}

const houseWinMat = new THREE.MeshBasicMaterial({ color: 0x2b3e4f });

const wallMats = [ new THREE.MeshStandardMaterial({ color:0xefe3cc, roughness:0.95 }), new THREE.MeshStandardMaterial({ color:0xdfe9ef, roughness:0.95 }) ];

function buildHouse(variant){
  const g = new THREE.Group();
  const walls = new THREE.Mesh(houseBaseGeom, wallMats[variant]);
  walls.position.y = 1.7; walls.castShadow = true; walls.receiveShadow = true; g.add(walls);
  const roof = new THREE.Mesh(houseRoofGeom, roofMats[variant]);
  roof.position.y = 3.4 + 1.15; roof.rotation.y = Math.PI/4; roof.scale.set(1.06, 1, 0.9);
  roof.castShadow = true; g.add(roof);
  const ch = new THREE.Mesh(chimneyGeom, chimneyMat);
  ch.position.set(1.5, 4.9, 0.7); ch.castShadow = true; g.add(ch);

/* ================= chunks ================= */
const CHUNK = 260;
const chunks = new Map();
const terrainMat = new THREE.MeshStandardMaterial({ map: noiseTex, vertexColors:true, roughness:1, metalness:0 });
noiseTex.repeat.set(30, 30);
const ballastMat = new THREE.MeshStandardMaterial({ map: gravelTex, roughness:1 });
const sleeperGeom = new THREE.BoxGeometry(2.7, 0.13, 0.62);
const sleeperMat = new THREE.MeshStandardMaterial({ color:0x4c3a28, roughness:1 });
const railGeom = new THREE.BoxGeometry(0.1, 0.18, 7);
const railMat = new THREE.MeshStandardMaterial({ color:0xb9c1c9, roughness:0.32, metalness:0.85 });
const waterMat = new THREE.MeshStandardMaterial({ color:0x2f8fc4, roughness:0.22, metalness:0.1, transparent:true, opacity:0.92 });
const mountainMat = new THREE.MeshStandardMaterial({ color:0x8fb98a, roughness:1, flatShading:true });
const _dummy = new THREE.Object3D();
const _tp = new THREE.Vector3(), _ta = new THREE.Vector3();

function buildChunk(ci){
  const group = new THREE.Group();
  const centerX = ci*CHUNK + CHUNK/2;
  const latC = latAt(centerX);
  srand(9000 + ci*131);

  // 지형
  const tg = new THREE.PlaneGeometry(CHUNK, 470, 64, 52);
  tg.rotateX(-Math.PI/2);
  const pos = tg.attributes.position;
  const colors = new Float32Array(pos.count*3);
  const cc = new THREE.Color();
  const rockTint = new THREE.Color(0x868f99);
  for(let i=0;i<pos.count;i++){
    const wx = centerX + pos.getX(i), wz = latC + pos.getZ(i);
    const e0 = elevAt(wx);
    pos.setY(i, groundH(wx, wz));
    const pal = paletteAt3(wx);
    cc.copy(pal.gA).lerp(pal.gB, hash(Math.floor(wx/9)*3.7 + Math.floor(wz/9)*9.1));
    const dTrack = wz - latAt(wx);
    if(Math.abs(dTrack) < 10) cc.lerp(new THREE.Color(0x8a7355), (1-Math.abs(dTrack)/10)*0.55); // 선로 옆 흙
    if(pal.coast > 0.4 && dTrack > 13 && dTrack < 34) cc.lerp(new THREE.Color(0xe6d29a), pal.coast*0.85); // 모래사장
    const rkAmt = Math.max(pal.alpine, pal.mount*0.85);
    if(rkAmt > 0.3){ const rk = hash(Math.floor(wx/6)*7.3 + Math.floor(wz/6)*3.9); cc.lerp(rockTint, rkAmt * (0.2 + rk*0.5)); } // 산·설산 바위 질감
    const hh = pos.getY(i) - e0;
    if(hh > 13) cc.lerp(rockTint, clamp((hh-13)/36, 0, 0.5)); // 높은 곳은 어디서든 바위색
    colors[i*3]=cc.r; colors[i*3+1]=cc.g; colors[i*3+2]=cc.b;
  }
  tg.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, terrainMat);
  terrain.position.set(centerX, 0, latC);
  terrain.receiveShadow = true;
  group.add(terrain);

  // 노반 (자갈 리본)
  const steps = Math.floor(CHUNK/6.5);
  const bPos = [], bUv = [], bIdx = [];
  for(let i=0;i<=steps;i++){
    const s = ci*CHUNK + i*6.5;
    pathPoint(s, _tp);
    const ahead = pathPoint(s+2, _ta);
    const dx = ahead.x-_tp.x, dz = ahead.z-_tp.z, il = 1/Math.hypot(dx,dz);
    const px = -dz*il, pz = dx*il;
    bPos.push(_tp.x+px*3.6, _tp.y+0.07, _tp.z+pz*3.6, _tp.x-px*3.6, _tp.y+0.07, _tp.z-pz*3.6);
    bUv.push(0, s/6, 1, s/6);
    if(i<steps){ const a=i*2; bIdx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bPos), 3));
  bg.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(bUv), 2));
  bg.setIndex(bIdx); bg.computeVertexNormals();
  const ballast = new THREE.Mesh(bg, ballastMat);
  ballast.receiveShadow = true; ballast.frustumCulled = false;
  group.add(ballast);

  // 침목 + 레일 (인스턴싱)
  const nS = Math.floor(CHUNK/2.3);
  const sleepers = new THREE.InstancedMesh(sleeperGeom, sleeperMat, nS);
  for(let i=0;i<nS;i++){
    const s = ci*CHUNK + i*2.3;
    pathPoint(s, _tp); pathPoint(s+2, _ta);
    _dummy.position.set(_tp.x, _tp.y+0.13, _tp.z);
    _dummy.lookAt(_ta.x, _ta.y+0.13, _ta.z);
    _dummy.updateMatrix();
    sleepers.setMatrixAt(i, _dummy.matrix);
  }
  sleepers.frustumCulled = false; sleepers.receiveShadow = true;
  group.add(sleepers);
  const nR = Math.floor(CHUNK/6.5);
  const rails = new THREE.InstancedMesh(railGeom, railMat, nR*2);
  for(let i=0;i<nR;i++){
    const s = ci*CHUNK + i*6.5;
    pathPoint(s, _tp); pathPoint(s+2, _ta);
    const dx=_ta.x-_tp.x, dz=_ta.z-_tp.z, il=1/Math.hypot(dx,dz);
    const px=-dz*il, pz=dx*il;
    for(let k=0;k<2;k++){
      const off = k===0? 0.75 : -0.75;
      _dummy.position.set(_tp.x+px*off, _tp.y+0.28, _tp.z+pz*off);
      _dummy.lookAt(_ta.x+px*off, _ta.y+0.28, _ta.z+pz*off);
      _dummy.updateMatrix();
      rails.setMatrixAt(i*2+k, _dummy.matrix);
    }
  }
  rails.frustumCulled = false;
  group.add(rails);

  // 전신주 (선로를 따라)
  const nP = Math.floor(CHUNK/46);
  const poles = new THREE.InstancedMesh(poleGeomInst, foliageMat, nP);
  for(let i=0;i<nP;i++){
    const s = ci*CHUNK + i*46 + 24;
    pathPoint(s, _tp); pathPoint(s+2, _ta);
    const dx=_ta.x-_tp.x, dz=_ta.z-_tp.z, il=1/Math.hypot(dx,dz);
    const px=-dz*il, pz=dx*il;
    _dummy.position.set(_tp.x - px*9.5, _tp.y - 0.1, _tp.z - pz*9.5);
    _dummy.lookAt(_ta.x - px*9.5, _ta.y - 0.1, _ta.z - pz*9.5);
    _dummy.rotation.x = 0; _dummy.rotation.z = 0;
    _dummy.updateMatrix();
    poles.setMatrixAt(i, _dummy.matrix);
  }
  poles.castShadow = true; poles.frustumCulled = false;
  group.add(poles);

  // 나무/바위 (인스턴싱)
  const bName = biomeAt3(centerX).sub;
  const plan = { pine:0, pineSnow:0, round:0, palm:0, cactus:0, rock:0, bush:0 };
  if(bName==='MEADOW'){ plan.round=34; plan.pine=10; plan.rock=3; plan.bush=14; }
  else if(bName==='FOREST'){ plan.pine=56; plan.round=10; plan.rock=3; plan.bush=10; }
  else if(bName==='MOUNTAIN'){ plan.pine=32; plan.round=8; plan.rock=14; plan.bush=6; }
  else if(bName==='COAST'){ plan.palm=22; plan.round=7; plan.rock=2; plan.bush=6; }
  else if(bName==='DESERT'){ plan.cactus=20; plan.rock=12; }
  else if(bName==='SNOW'){ plan.pineSnow=42; plan.rock=2; }
  else if(bName==='ALPINE'){ plan.pineSnow=22; plan.rock=20; }
  else if(bName==='NIGHT'){ plan.pine=30; plan.round=6; }
  for(const type of Object.keys(plan)){
    const cnt = plan[type];
    if(!cnt) continue;
    const inst = new THREE.InstancedMesh(GEOMS[type], foliageMat, cnt);
    let placed = 0, guard = 0;
    while(placed < cnt && guard++ < cnt*30){
      const x = ci*CHUNK + rnd()*CHUNK;
      const side = rnd()<0.5? -1: 1;
      const dist = 15 + rnd()*185;
      const z = latAt(x) + side*dist;
      if(bName==='COAST' && side>0 && dist>26 && type!=='rock') continue;   // 바다 쪽엔 나무 없음
      if(bName==='COAST' && side>0 && type==='palm' && dist>30) continue;
      const sc = 0.8 + rnd()*0.75;
      _dummy.position.set(x, groundH(x,z)-0.08, z);
      _dummy.rotation.set(0, rnd()*Math.PI*2, 0);
      _dummy.scale.set(sc, sc*(0.9+rnd()*0.25), sc);
      _dummy.updateMatrix();
      inst.setMatrixAt(placed++, _dummy.matrix);
    }
    inst.count = placed;
    inst.castShadow = true; inst.frustumCulled = false;
    group.add(inst);
  }
  _dummy.rotation.set(0,0,0); _dummy.scale.set(1,1,1);

  // 집
  const nH = bName==='MEADOW'?2 : bName==='SNOW'?2 : bName==='NIGHT'?3 : bName==='COAST'?1 : 0;
  for(let i=0;i<nH;i++){
    const hx = ci*CHUNK + 30 + rnd()*(CHUNK-60);
    const side = rnd()<0.5? -1: 1;
    const hz = latAt(hx) + side*(26 + rnd()*70);
    const house = buildHouse(Math.floor(rnd()*2));
    house.position.set(hx, groundH(hx,hz)-0.05, hz);
    house.rotation.y = (side<0? Math.PI : 0) + (rnd()-0.5)*0.7 + Math.PI/4*0;
    house.rotation.y += Math.atan2(-(latAt(hx+4)-latAt(hx-4)), 8)*0; // 선로 방향 대략 맞춤 (미세)
    group.add(house);
  }

  // 먼 산 (산·설산에서는 크고 가깝게)
  const isAlp = bName==='ALPINE' || bName==='MOUNTAIN';
  if(rnd() < (isAlp? 1 : 0.85)){
    const nM = isAlp? 2 + Math.floor(rnd()*2) : 1 + Math.floor(rnd()*2);
    for(let i=0;i<nM;i++){
      const mx = ci*CHUNK + rnd()*CHUNK;
      const side = rnd()<0.5? -1: 1;
      const mz = latAt(mx) + side*(isAlp? 235 + rnd()*100 : 310 + rnd()*130);
      const m = new THREE.Mesh(new THREE.ConeGeometry(isAlp? 150+rnd()*120 : 90+rnd()*90, isAlp? 135+rnd()*100 : 80+rnd()*80, 5), mountainMat);
      m.position.set(mx, -6, mz);
      m.rotation.y = rnd()*Math.PI;
      group.add(m);
    }
  }

  // 바다
  const palC = paletteAt3(centerX);
  if(palC.coast > 0.4){
    const wgeo = new THREE.PlaneGeometry(CHUNK, 210);
    wgeo.rotateX(-Math.PI/2);
    const water = new THREE.Mesh(wgeo, waterMat);
    water.position.set(centerX, elevAt(centerX)-0.5, latC + 34 + 100);
    group.add(water);
  }

  scene.add(group);
  chunks.set(ci, group);
}
function updateChunks(){
  const lo = Math.floor((headS-300)/CHUNK), hi = Math.floor((headS+820)/CHUNK);
  for(let ci=lo; ci<=hi; ci++) if(!chunks.has(ci)) buildChunk(ci);
  for(const [ci, g] of chunks){
    if(ci<lo || ci>hi){
      scene.remove(g);
      g.traverse(o=>{ if(o.geometry && o.geometry!==sleeperGeom && o.geometry!==railGeom && !SHARED_GEO.has(o.geometry)) o.geometry.dispose(); });
      chunks.delete(ci);
    }
  }
}

const TRACK_TOP = 0.37;
const TRAIN_COLORS = [0x31556e, 0x8a4b38, 0x4a6741, 0x6b5b8f, 0x8a6d3b, 0x546e7a];
const winMat = new THREE.MeshBasicMaterial({ map: windowStripTex, transparent:true, color: 0x2b3e4f, side: THREE.DoubleSide });
const roofMat = new THREE.MeshStandardMaterial({ color:0x2e3134, roughness:0.6, metalness:0.3 });
const darkMetal = new THREE.MeshStandardMaterial({ color:0x1d2126, roughness:0.55, metalness:0.5 });
const wheelGeom = new THREE.CylinderGeometry(0.48, 0.48, 0.2, 14);
wheelGeom.rotateZ(Math.PI/2);
const trainWheels = [];
let headlight = null, locoStack = new THREE.Vector3();

function buildCar(idx){
  const isLoco = idx===0;
  const len = isLoco? 12.5 : 11, wid = 2.95;
  const g = new THREE.Group();
  const sideTex = carSideTexture(TRAIN_COLORS[idx], isLoco);
  const sideMat = new THREE.MeshStandardMaterial({ map: sideTex, roughness:0.38, metalness:0.35 });
  const paintMat = new THREE.MeshStandardMaterial({ color: TRAIN_COLORS[idx], roughness:0.42, metalness:0.3 });
  const frontMat = isLoco
    ? new THREE.MeshStandardMaterial({ map: locoFrontTexture(), roughness:0.4, metalness:0.3 })
    : paintMat;
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(wid, 2.6, len),
    [sideMat, sideMat, roofMat, darkMetal, frontMat, paintMat]
  );
  body.position.y = 2.3; body.castShadow = true;
  g.add(body);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(wid*0.9, 0.26, len*0.94), roofMat);
  roof.position.y = 3.72; roof.castShadow = true; g.add(roof);
  if(!isLoco){
    const ac = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, 3.4), darkMetal);
    ac.position.set(0, 3.92, 0.6); g.add(ac);
  } else {
    for(const dz of [-3.4, -4.3]){
      const stack = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.5, 8), darkMetal);
      stack.position.set(0, 3.95, dz); g.add(stack);
    }
    const lampGeo = new THREE.SphereGeometry(0.13, 8, 8);
    const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff3c4 });
    for(const lx of [-0.85, 0.85]){
      const lamp = new THREE.Mesh(lampGeo, lampMat);
      lamp.position.set(lx, 2.62, len/2 + 0.06); g.add(lamp);
    }
    headlight = new THREE.SpotLight(0xffe6b0, 0, 90, 0.42, 0.55, 1);
    headlight.position.set(0, 2.6, len/2);
    const tgt = new THREE.Object3D(); tgt.position.set(0, 0.8, len/2 + 42);
    g.add(tgt); headlight.target = tgt;
    g.add(headlight);
  }
  const under = new THREE.Mesh(new THREE.BoxGeometry(wid*0.78, 0.55, len*0.92), darkMetal);
  under.position.y = 0.78; g.add(under);
  // 창문 띠 (양옆)
  for(const sx of [-1, 1]){
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(len*0.8, 0.85), winMat);
    strip.position.set(sx*(wid/2 + 0.02), 2.72, 0);
    strip.rotation.y = sx>0? Math.PI/2 : -Math.PI/2;
    g.add(strip);
  }
  // 대차 + 바퀴
  for(const bz of [len/2 - 2.1, -(len/2 - 2.1)]){
    const bogie = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.42, 3.1), darkMetal);
    bogie.position.set(0, 0.5, bz); g.add(bogie);
    for(const wx of [-1.02, 1.02]) for(const wz of [-0.95, 0.95]){
      const wheel = new THREE.Mesh(wheelGeom, darkMetal);
      wheel.position.set(wx, 0.48, bz + wz);
      g.add(wheel); trainWheels.push(wheel);
    }
  }
  return { group: g, len };
}
const cars = [];
{
  let off = 0;
  for(let i=0;i<6;i++){
    const c = buildCar(i);
    off += (i===0? 0 : 0.55) + c.len/2;
    cars.push({ ...c, centerOff: off });
    off += c.len/2;
    scene.add(c.group);
  }
}
const _pp = new THREE.Vector3(), _pa = new THREE.Vector3();
function placeTrain(){
  for(const c of cars){
    pathPoint(headS - c.centerOff, _pp);
    pathPoint(headS - c.centerOff + 2.5, _pa);
    c.group.position.set(_pp.x, _pp.y + TRACK_TOP, _pp.z);
    c.group.lookAt(_pa.x, _pa.y + TRACK_TOP, _pa.z);
  }
  const loco = cars[0];
  loco.group.localToWorld(locoStack.set(0, 4.3, -3.4));
}

  }
}
scene.add(cloudGroup);

/* ================= falling snow ================= */
const SNOW_N = 380;
const snowPos = new Float32Array(SNOW_N*3);
const snowVel = new Float32Array(SNOW_N);
{
  srand(555);
  for(let i=0;i<SNOW_N;i++){
    snowPos[i*3] = (rnd()-0.5)*150;
    snowPos[i*3+1] = rnd()*48;
    snowPos[i*3+2] = (rnd()-0.5)*150;
    snowVel[i] = 4.5 + rnd()*4;
  }
}
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snowMat = new THREE.PointsMaterial({ color:0xffffff, size:0.55, transparent:true, opacity:0, depthWrite:false });
const snowPts = new THREE.Points(snowGeo, snowMat);
snowPts.frustumCulled = false;
scene.add(snowPts);
function updateSnow(dt, t){
  snowPts.position.set(camera.position.x, camera.position.y - 8, camera.position.z);
  for(let i=0;i<SNOW_N;i++){
    let y = snowPos[i*3+1] - snowVel[i]*dt;
    if(y < 0) y += 48;
    snowPos[i*3+1] = y;
    snowPos[i*3] += Math.sin(t*0.9 + i)*dt*0.7;
  }
  snowGeo.attributes.position.needsUpdate = true;
}

/* ================= smoke ================= */
const puffs = [];
for(let i=0;i<42;i++){
  const sm = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex, transparent:true, opacity:0, depthWrite:false }));
  sm.scale.set(2,2,1);
  scene.add(sm);
  puffs.push({ sm, life:0, vel:new THREE.Vector3() });
}
let puffTimer = 0;
function updateSmoke(dt){
  puffTimer -= dt;
  if(playing && puffTimer <= 0){
    puffTimer = 0.14;
    const p = puffs.find(q=>q.life<=0);
    if(p){
      p.life = 1;
      p.sm.position.copy(locoStack);
      p.vel.set(-1.2 - Math.random(), 2.6 + Math.random()*0.8, (Math.random()-0.5)*0.6);
    }
  }
  for(const p of puffs){
    if(p.life <= 0) continue;
    p.life -= dt*0.42;
    p.sm.position.addScaledVector(p.vel, dt);
    const sc = 2 + (1-p.life)*7;
    p.sm.scale.set(sc, sc, 1);
    p.sm.material.opacity = 0.34 * Math.max(p.life, 0);
  }
}

/* ================= state / UI ================= */
let playing = true, speedMul = 1, headS = 30, elapsed = 0, lastBiome = -1;
const regionEl = document.getElementById('region');
const clockEl = document.getElementById('clock');
let regionTimer = null;
function announce(b){
  regionEl.innerHTML = `${b.name}<small>${b.sub}</small>`;
  regionEl.style.opacity = 1;
  clearTimeout(regionTimer);
  regionTimer = setTimeout(()=>{ regionEl.style.opacity = 0; }, 3400);
}
document.getElementById('playBtn').addEventListener('click', e=>{
  playing=!playing; e.target.textContent = playing? "멈추기" : "계속 가기";
});
const speeds=[1,0.5,1.7]; let speedIdx=0;
document.getElementById('speedBtn').addEventListener('click', e=>{
  speedIdx=(speedIdx+1)%speeds.length; speedMul=speeds[speedIdx];
  e.target.textContent = "속도 "+speedMul+"배";
});
const CAMS = ["영화", "옆에서", "기관실", "위에서"];
let camMode = 0;
document.getElementById('camBtn').addEventListener('click', e=>{
  camMode = (camMode+1)%CAMS.length;
  e.target.textContent = "카메라: " + CAMS[camMode];
});
/* 맵 선택 버튼 */
const MAP_LABELS = ["초원", "숲", "산", "바다", "사막", "눈 마을", "설산", "밤"];
const mapChips = [];
{
  const bar = document.getElementById('mapbar');
  PALS.forEach((p, idx)=>{
    const b = document.createElement('button');
    b.textContent = MAP_LABELS[idx] || p.name;
    b.addEventListener('click', ()=> jumpToBiome(idx));
    bar.appendChild(b);
    mapChips.push(b);
  });
}
function jumpToBiome(idx){
  const n = PALS.length, ci = Math.floor(headS/SEG3);
  for(let k=0;k<=n;k++){
    const cand = ci + k;
    if(((cand % n) + n) % n === idx){ headS = cand*SEG3 + 30; break; }
  }
  lastBiome = -1;
}
function markMapChip(){
  const n = PALS.length;
  const cur = ((biomeIndexAt3(headS) % n) + n) % n;
  mapChips.forEach((b, i)=> b.classList.toggle('on', i === cur));
}
let audioCtx=null, audioOn=false, padTimer=null;
function toggleAudio(){
  if(audioOn){
    audioOn=false; clearInterval(padTimer); if(audioCtx) audioCtx.close(); audioCtx=null;
    document.getElementById('soundBtn').textContent="소리 켜기"; return;
  }
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const chords = [[261.6,329.6,392.0],[220.0,261.6,329.6],[174.6,220.0,261.6],[196.0,246.9,293.7]];
  let ci=0;
  const playChord=()=>{
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    chords[ci%chords.length].forEach(f=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.045,t+1.6);
      g.gain.linearRampToValueAtTime(0.0001,t+7.8);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+8);
    });
    ci++;
  };
  playChord(); padTimer=setInterval(playChord, 7000);
  audioOn=true; document.getElementById('soundBtn').textContent="소리 끄기";
}
document.getElementById('soundBtn').addEventListener('click', toggleAudio);
if(navigator.wakeLock){ navigator.wakeLock.request('screen').catch(()=>{}); }
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ================= camera ================= */
const _fwd = new THREE.Vector3(), _rgt = new THREE.Vector3(), _ctr = new THREE.Vector3(), _want = new THREE.Vector3(), _look = new THREE.Vector3();
const UP = new THREE.Vector3(0,1,0);
let camInit = false;
function updateCamera(dt, t){
  pathPoint(headS - 20, _ctr);
  pathPoint(headS + 6, _pa); pathPoint(headS - 30, _pp);
  _fwd.copy(_pa).sub(_pp).setY(0).normalize();
  _rgt.crossVectors(_fwd, UP).normalize().negate();
  const locoP = cars[0].group.position;
  let snap = 2.6;
  if(camMode===0){ // 영화: 천천히 도는 시네마틱
    const ang = Math.sin(t*0.06)*0.95 + 0.55;
    _want.copy(_ctr).addScaledVector(_fwd, Math.cos(ang)*30).addScaledVector(_rgt, Math.sin(ang)*30);
    _want.y = _ctr.y + 8.5 + Math.sin(t*0.11)*1.6;
    _look.copy(_ctr); _look.y += 2.5;
  } else if(camMode===1){ // 옆에서 따라가기
    _want.copy(_ctr).addScaledVector(_rgt, 23); _want.y = _ctr.y + 5;
    _look.copy(_ctr); _look.y += 2.4;
  } else if(camMode===2){ // 기관실
    _want.copy(locoP).addScaledVector(_fwd, 5.4); _want.y = locoP.y + 3.4;
    pathPoint(headS + 55, _look); _look.y += 1.2;
    snap = 14;
  } else { // 위에서
    _want.copy(_ctr).addScaledVector(_fwd, -30); _want.y = _ctr.y + 30;
    _look.copy(_ctr); _look.y += 1;
  }
  if(!camInit){ camera.position.copy(_want); camInit = true; }
  else camera.position.lerp(_want, 1 - Math.exp(-dt*snap));
  camera.lookAt(_look);
}

/* ================= main loop ================= */
const winDay = new THREE.Color(0x2b3e4f), winNight = new THREE.Color(0xffca7a), _wc = new THREE.Color();
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.max(0, Math.min((now-last)/1000, 0.05)); last = now;
  const speed = 15 * speedMul;
  if(playing){ headS += speed*dt; elapsed += dt; }

  updateChunks();
  placeTrain();
  if(playing){
    const wAng = speed*dt/0.48;
    for(const w of trainWheels) w.rotation.x -= wAng;
  }
  updateSmoke(dt);

  const pal = paletteAt3(headS);
  scene.background.copy(pal.sky);
  scene.fog.color.copy(pal.sky);
  skyDome.position.copy(camera.position);
  _skyTop.copy(pal.sky).lerp(_black, 0.14); _skyBot.copy(pal.sky).lerp(_white, 0.3);
  skyMat.uniforms.top.value.copy(_skyTop); skyMat.uniforms.bot.value.copy(_skyBot);
  hemi.color.copy(pal.sky); hemi.groundColor.copy(pal.gB); hemi.intensity = pal.hemiI;
  sun.color.copy(pal.sun); sun.intensity = pal.sunI;
  mountainMat.color.copy(pal.far);
  const tp = cars[0].group.position;
  sun.position.set(tp.x + 190, tp.y + 260, tp.z + 130);
  sun.target.position.copy(tp);
  starMat.opacity = pal.night * 0.95;
  snowMat.opacity = pal.snow * 0.95;
  if(pal.snow > 0.02) updateSnow(dt, now/1000);
  stars.position.copy(camera.position);
  _wc.copy(winDay).lerp(winNight, pal.night);
  winMat.color.copy(_wc); houseWinMat.color.copy(_wc);
  if(headlight) headlight.intensity = pal.night * 2.4;
  waterMat.color.copy(pal.sky).lerp(new THREE.Color(0x1d6ea8), 0.72);

  // 구름 드리프트
  for(const cl of cloudGroup.children){
    cl.position.x += dt*1.3;
    if(cl.position.x < headS - 800) cl.position.x += 1700;
    if(cl.position.x > headS + 900) cl.position.x -= 1700;
  }

  updateCamera(dt, elapsed);

  const bi = biomeIndexAt3(headS);
  if(bi !== lastBiome){ lastBiome = bi; announce(biomeAt3(headS)); markMapChip(); }
  const mm = String(Math.floor(elapsed/60)).padStart(2,'0'), ss = String(Math.floor(elapsed%60)).padStart(2,'0');
  clockEl.textContent = `${mm}:${ss}`;
  renderer.render(scene, camera);
}
announce(PALS[0]);
document.getElementById('loading').style.display='none';
requestAnimationFrame(frame);
</script>
